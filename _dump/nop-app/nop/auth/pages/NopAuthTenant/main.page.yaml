type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopAuthTenant__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: md
      title: '@i18n:NopAuthTenant.forms.add.$title|新增-租户'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopAuthTenant__save/id'
        body:
        - type: group
          id: row-name
          body:
            name: name
            label: '@i18n:cell.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-beginTime
          body:
            name: beginTime
            label: '@i18n:cell.NopAuthTenant.beginTime,prop.label.NopAuthTenant.beginTime|开始时间'
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-endTime
          body:
            name: endTime
            label: '@i18n:cell.NopAuthTenant.endTime,prop.label.NopAuthTenant.endTime|结束时间'
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-status
          body:
            name: status
            label: '@i18n:cell.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
            required: true
            type: select
            searchable: true
            clearable: true
            multiple: false
            source: '@dict:auth/tenant-status'
            value: '1'
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopAuthTenant.remark,prop.label.NopAuthTenant.remark|备注'
            type: textarea
            minRows: 3
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthTenant__findPage'
    gql:selection: total,page,items{ id,tenantId,name,beginTime,endTime,status,status_label,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${name}
  filter:
    id: crud-filter
    mode: horizontal
    rules: [
      ]
    body:
    - type: group
      id: row-name-status
      body:
      - name: filter_name
        label: '@i18n:cell.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
        type: input-text
        clearable: true
      - name: filter_status
        label: '@i18n:cell.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
        type: select
        searchable: true
        clearable: true
        multiple: false
        source: '@dict:auth/tenant-status'
    actions:
    - type: reset
      label: '@i18n:common.reset'
      id: reset-button
    - type: submit
      label: '@i18n:common.query'
      level: primary
      id: submit-button
  columns:
  - name: tenantId
    label: '@i18n:col.NopAuthTenant.tenantId,prop.label.NopAuthTenant.tenantId|主键'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: name
    label: '@i18n:col.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
    sortable: true
    toggled: true
    type: static
  - name: beginTime
    label: '@i18n:col.NopAuthTenant.beginTime,prop.label.NopAuthTenant.beginTime|开始时间'
    sortable: true
    toggled: true
    type: static
  - name: endTime
    label: '@i18n:col.NopAuthTenant.endTime,prop.label.NopAuthTenant.endTime|结束时间'
    sortable: true
    toggled: true
    type: static
  - name: status_label
    label: '@i18n:col.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopAuthTenant.createdBy,prop.label.NopAuthTenant.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopAuthTenant.createTime,prop.label.NopAuthTenant.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopAuthTenant.updatedBy,prop.label.NopAuthTenant.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopAuthTenant.updateTime,prop.label.NopAuthTenant.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthTenant.remark,prop.label.NopAuthTenant.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopAuthTenant.forms.view.$title|查看-租户'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopAuthTenant__get?id=$id'
            gql:selection: id,tenantId,name,beginTime,endTime,status,status_label,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-tenantId-name
            body:
            - name: tenantId
              label: '@i18n:cell.NopAuthTenant.tenantId,prop.label.NopAuthTenant.tenantId|主键'
              required: true
              type: static
            - name: name
              label: '@i18n:cell.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
              required: true
              type: static
          - type: group
            id: row-beginTime-endTime
            body:
            - name: beginTime
              label: '@i18n:cell.NopAuthTenant.beginTime,prop.label.NopAuthTenant.beginTime|开始时间'
              type: static
            - name: endTime
              label: '@i18n:cell.NopAuthTenant.endTime,prop.label.NopAuthTenant.endTime|结束时间'
              type: static
          - type: group
            id: row-status-createdBy
            body:
            - name: status_label
              label: '@i18n:cell.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
              required: true
              type: static
            - name: createdBy
              label: '@i18n:cell.NopAuthTenant.createdBy,prop.label.NopAuthTenant.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime-updatedBy
            body:
            - name: createTime
              label: '@i18n:cell.NopAuthTenant.createTime,prop.label.NopAuthTenant.createTime|创建时间'
              required: true
              type: static
            - name: updatedBy
              label: '@i18n:cell.NopAuthTenant.updatedBy,prop.label.NopAuthTenant.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime
            body:
              name: updateTime
              label: '@i18n:cell.NopAuthTenant.updateTime,prop.label.NopAuthTenant.updateTime|修改时间'
              required: true
              type: static
          - type: group
            id: row-remark
            body:
              name: remark
              label: '@i18n:cell.NopAuthTenant.remark,prop.label.NopAuthTenant.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: md
          title: '@i18n:NopAuthTenant.forms.edit.$title|编辑-租户'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopAuthTenant__get?id=$id'
              gql:selection: id,tenantId,name,beginTime,endTime,status,status_label,remark
            api:
              data:
                name: $name
                beginTime: $beginTime
                endTime: $endTime
                status: $status
                remark: $remark
              url: '@mutation:NopAuthTenant__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-name
              body:
                name: name
                label: '@i18n:cell.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-beginTime
              body:
                name: beginTime
                label: '@i18n:cell.NopAuthTenant.beginTime,prop.label.NopAuthTenant.beginTime|开始时间'
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-endTime
              body:
                name: endTime
                label: '@i18n:cell.NopAuthTenant.endTime,prop.label.NopAuthTenant.endTime|结束时间'
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-status
              body:
                name: status
                label: '@i18n:cell.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
                required: true
                type: select
                searchable: true
                clearable: true
                multiple: false
                source: '@dict:auth/tenant-status'
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopAuthTenant.remark,prop.label.NopAuthTenant.remark|备注'
                type: textarea
                minRows: 3
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopAuthTenant__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
