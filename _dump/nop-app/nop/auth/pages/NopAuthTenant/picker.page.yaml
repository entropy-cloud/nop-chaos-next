type: picker
valueField: id
labelField: name
size: lg
modalSize: lg
source:
  valueField: id
  labelField: name
  url: '@query:NopAuthTenant__findPage'
  gql:selection: total,page,items{ id,tenantId,name,beginTime,endTime,status,status_label,createdBy,createTime,updatedBy,updateTime,remark
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthTenant__findPage'
    gql:selection: total,page,items{ id,tenantId,name,beginTime,endTime,status,status_label,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${name}
  filter:
    id: crud-filter
    mode: horizontal
    rules: [
      ]
    body:
    - type: group
      id: row-name-status
      body:
      - name: filter_name
        label: '@i18n:cell.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
        type: input-text
        clearable: true
      - name: filter_status
        label: '@i18n:cell.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
        type: select
        searchable: true
        clearable: true
        multiple: false
        source: '@dict:auth/tenant-status'
    actions:
    - type: reset
      label: '@i18n:common.reset'
      id: reset-button
    - type: submit
      label: '@i18n:common.query'
      level: primary
      id: submit-button
  columns:
  - name: tenantId
    label: '@i18n:col.NopAuthTenant.tenantId,prop.label.NopAuthTenant.tenantId|主键'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: name
    label: '@i18n:col.NopAuthTenant.name,prop.label.NopAuthTenant.name|名称'
    sortable: true
    toggled: true
    type: static
  - name: beginTime
    label: '@i18n:col.NopAuthTenant.beginTime,prop.label.NopAuthTenant.beginTime|开始时间'
    sortable: true
    toggled: true
    type: static
  - name: endTime
    label: '@i18n:col.NopAuthTenant.endTime,prop.label.NopAuthTenant.endTime|结束时间'
    sortable: true
    toggled: true
    type: static
  - name: status_label
    label: '@i18n:col.NopAuthTenant.status,prop.label.NopAuthTenant.status|租户状态'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopAuthTenant.createdBy,prop.label.NopAuthTenant.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopAuthTenant.createTime,prop.label.NopAuthTenant.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopAuthTenant.updatedBy,prop.label.NopAuthTenant.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopAuthTenant.updateTime,prop.label.NopAuthTenant.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthTenant.remark,prop.label.NopAuthTenant.remark|备注'
    sortable: true
    toggled: true
    type: static
