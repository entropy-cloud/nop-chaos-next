type: picker
valueField: id
labelField: displayName
size: lg
modalSize: lg
source:
  valueField: id
  labelField: displayName
  url: '@query:NopAuthSite__findPage'
  gql:selection: total,page,items{ id,siteId,displayName,orderNo,url,status,status_label,extConfig,extConfigComponent,configVersion,createdBy,createTime,updatedBy,updateTime,remark
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthSite__findPage'
    gql:selection: total,page,items{ id,siteId,displayName,orderNo,url,status,status_label,extConfig,extConfigComponent,configVersion,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${displayName}
  columns:
  - name: siteId
    label: '@i18n:col.NopAuthSite.siteId,prop.label.NopAuthSite.siteId|站点ID'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: displayName
    label: '@i18n:col.NopAuthSite.displayName,prop.label.NopAuthSite.displayName|显示名称'
    sortable: true
    toggled: true
    type: static
  - name: orderNo
    label: '@i18n:col.NopAuthSite.orderNo,prop.label.NopAuthSite.orderNo|排序'
    sortable: true
    toggled: true
    type: static
  - name: url
    label: '@i18n:col.NopAuthSite.url,prop.label.NopAuthSite.url|链接'
    sortable: true
    toggled: true
    type: static
  - name: status_label
    label: '@i18n:col.NopAuthSite.status,prop.label.NopAuthSite.status|状态'
    sortable: true
    toggled: true
    type: static
  - name: extConfig
    label: '@i18n:col.NopAuthSite.extConfig,prop.label.NopAuthSite.extConfig|扩展配置'
    sortable: true
    toggled: true
    type: static
  - name: configVersion
    label: '@i18n:col.NopAuthSite.configVersion,prop.label.NopAuthSite.configVersion|配置版本'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopAuthSite.createdBy,prop.label.NopAuthSite.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopAuthSite.createTime,prop.label.NopAuthSite.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopAuthSite.updatedBy,prop.label.NopAuthSite.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopAuthSite.updateTime,prop.label.NopAuthSite.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthSite.remark,prop.label.NopAuthSite.remark|备注'
    sortable: true
    toggled: true
    type: static
