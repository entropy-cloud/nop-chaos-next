type: page
name: test
size: sm
title: '@i18n:null.forms.test.$title'
body:
  type: form
  name: test
  mode: horizontal
  rules: [
    ]
  body:
  - type: group
    id: row-fldA-fldB
    body:
    - name: fldA
      label: '@i18n:cell.null.fldA|FieldA'
      clearValueOnHidden: false
      type: input-text
      clearable: true
      validations:
        maxLength: null
        minLength: null
        matchRegexp: null
      transform:
        upperCase: null
        lowerCase: null
    - name: fldB
      label: '@i18n:cell.null.fldB|FieldB'
      clearValueOnHidden: false
      type: input-text
      validations: isInt
  actions:
  - type: action
    id: submit
    actionType: submit
    label: Submit
  - type: action
    id: test
    actionType: custom
    label: TestDemoAction
    onEvent:
      click:
        actions:
        - type: action
          actionType: page-action
          actionName: '@action:demo.handlePageAction'
          args:
            a: ${fldA}
xui:import: /nop/auth/pages/DemoPage/demo.lib.js
