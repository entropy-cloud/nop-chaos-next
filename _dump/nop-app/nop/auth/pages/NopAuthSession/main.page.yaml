type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopAuthSession__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthSession__findPage'
    gql:selection: total,page,items{ id,sessionId,user{userName},userId,userName,loginAddr,loginDevice,loginApp,loginOs,loginTime,loginType,loginType_label,logoutTime,logoutType,logoutType_label,logoutBy,remark
      }
  columns:
  - name: sessionId
    label: '@i18n:col.NopAuthSession.sessionId,prop.label.NopAuthSession.sessionId|会话ID'
    sortable: true
    width: 210px
    toggled: true
    fixed: left
    type: static
  - name: user.userName
    label: '@i18n:col.NopAuthSession.userId,prop.label.NopAuthSession.userId|用户ID'
    sortable: true
    width: 205px
    toggled: true
    type: static
  - name: userName
    label: '@i18n:col.NopAuthSession.userName,prop.label.NopAuthSession.userName|用户名'
    sortable: true
    toggled: true
    type: static
  - name: loginAddr
    label: '@i18n:col.NopAuthSession.loginAddr,prop.label.NopAuthSession.loginAddr|登录地址'
    sortable: true
    toggled: true
    type: static
  - name: loginDevice
    label: '@i18n:col.NopAuthSession.loginDevice,prop.label.NopAuthSession.loginDevice|登录设备'
    sortable: true
    toggled: true
    type: static
  - name: loginApp
    label: '@i18n:col.NopAuthSession.loginApp,prop.label.NopAuthSession.loginApp|应用程序'
    sortable: true
    toggled: true
    type: static
  - name: loginOs
    label: '@i18n:col.NopAuthSession.loginOs,prop.label.NopAuthSession.loginOs|操作系统'
    sortable: true
    toggled: true
    type: static
  - name: loginTime
    label: '@i18n:col.NopAuthSession.loginTime,prop.label.NopAuthSession.loginTime|登录时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: loginType_label
    label: '@i18n:col.NopAuthSession.loginType,prop.label.NopAuthSession.loginType|登录方式'
    sortable: true
    toggled: true
    type: static
  - name: logoutTime
    label: '@i18n:col.NopAuthSession.logoutTime,prop.label.NopAuthSession.logoutTime|退出时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: logoutType_label
    label: '@i18n:col.NopAuthSession.logoutType,prop.label.NopAuthSession.logoutType|退出方式'
    sortable: true
    toggled: true
    type: static
  - name: logoutBy
    label: '@i18n:col.NopAuthSession.logoutBy,prop.label.NopAuthSession.logoutBy|退出操作人'
    sortable: true
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthSession.remark,prop.label.NopAuthSession.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopAuthSession.forms.view.$title|查看-会话日志'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopAuthSession__get?id=$id'
            gql:selection: id,sessionId,user{userName},userId,userName,loginAddr,loginDevice,loginApp,loginOs,loginTime,loginType,loginType_label,logoutTime,logoutType,logoutType_label,logoutBy,remark
          body:
          - type: group
            id: row-sessionId-userId
            body:
            - name: sessionId
              label: '@i18n:cell.NopAuthSession.sessionId,prop.label.NopAuthSession.sessionId|会话ID'
              required: true
              type: static
            - name: user.userName
              label: '@i18n:cell.NopAuthSession.userId,prop.label.NopAuthSession.userId|用户ID'
              required: true
              type: static
          - type: group
            id: row-userName-loginAddr
            body:
            - name: userName
              label: '@i18n:cell.NopAuthSession.userName,prop.label.NopAuthSession.userName|用户名'
              required: true
              type: static
            - name: loginAddr
              label: '@i18n:cell.NopAuthSession.loginAddr,prop.label.NopAuthSession.loginAddr|登录地址'
              type: static
          - type: group
            id: row-loginDevice-loginApp
            body:
            - name: loginDevice
              label: '@i18n:cell.NopAuthSession.loginDevice,prop.label.NopAuthSession.loginDevice|登录设备'
              type: static
            - name: loginApp
              label: '@i18n:cell.NopAuthSession.loginApp,prop.label.NopAuthSession.loginApp|应用程序'
              type: static
          - type: group
            id: row-loginOs-loginTime
            body:
            - name: loginOs
              label: '@i18n:cell.NopAuthSession.loginOs,prop.label.NopAuthSession.loginOs|操作系统'
              type: static
            - name: loginTime
              label: '@i18n:cell.NopAuthSession.loginTime,prop.label.NopAuthSession.loginTime|登录时间'
              required: true
              type: static
          - type: group
            id: row-loginType-logoutTime
            body:
            - name: loginType_label
              label: '@i18n:cell.NopAuthSession.loginType,prop.label.NopAuthSession.loginType|登录方式'
              required: true
              type: static
            - name: logoutTime
              label: '@i18n:cell.NopAuthSession.logoutTime,prop.label.NopAuthSession.logoutTime|退出时间'
              type: static
          - type: group
            id: row-logoutType-logoutBy
            body:
            - name: logoutType_label
              label: '@i18n:cell.NopAuthSession.logoutType,prop.label.NopAuthSession.logoutType|退出方式'
              required: true
              type: static
            - name: logoutBy
              label: '@i18n:cell.NopAuthSession.logoutBy,prop.label.NopAuthSession.logoutBy|退出操作人'
              type: static
          - type: group
            id: row-remark
            body:
              name: remark
              label: '@i18n:cell.NopAuthSession.remark,prop.label.NopAuthSession.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: ajax
        api:
          url: '@mutation:NopAuthSession__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
