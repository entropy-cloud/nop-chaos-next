                    type: static
                - type: group
                  id: row-phone-createdBy
                  body:
                  - name: phone
                    label: '@i18n:cell.NopAuthDept.phone,prop.label.NopAuthDept.phone|电话'
                    type: static
                  - name: createdBy
                    label: '@i18n:cell.NopAuthDept.createdBy,prop.label.NopAuthDept.createdBy|创建人'
                    required: true
                    type: static
                - type: group
                  id: row-createTime-updatedBy
                  body:
                  - name: createTime
                    label: '@i18n:cell.NopAuthDept.createTime,prop.label.NopAuthDept.createTime|创建时间'
                    required: true
                    type: static
                  - name: updatedBy
                    label: '@i18n:cell.NopAuthDept.updatedBy,prop.label.NopAuthDept.updatedBy|修改人'
                    required: true
                    type: static
                - type: group
                  id: row-updateTime
                  body:
                    name: updateTime
                    label: '@i18n:cell.NopAuthDept.updateTime,prop.label.NopAuthDept.updateTime|修改时间'
                    required: true
                    type: static
                - type: group
                  id: row-remark
                  body:
                    name: remark
                    label: '@i18n:cell.NopAuthDept.remark,prop.label.NopAuthDept.remark|备注'
                    type: static
            label: '@i18n:common.view'
            level: primary
          - type: dropdown-button
            id: row-more-button
            label: '@i18n:common.more'
            level: primary
            buttons:
            - actionType: dialog
              dialog:
                type: page
                name: update
                size: md
                title: '@i18n:NopAuthDept.forms.edit.$title|编辑-部门'
                body:
                  type: form
                  name: edit
                  mode: horizontal
                  rules: [
                    ]
                  initApi:
                    url: '@query:NopAuthDept__get?id=$id'
                    gql:selection: id,deptId,deptName,parent{deptName},parentId,orderNum,deptType,manager{userName},managerId,email,phone,remark
                  api:
                    data:
                      deptName: $deptName
                      parentId: $parentId
                      orderNum: $orderNum
                      deptType: $deptType
                      managerId: $managerId
                      email: $email
                      phone: $phone
                      remark: $remark
                    url: '@mutation:NopAuthDept__update/id?id=$id'
                    withFormData: true
                  body:
                  - type: group
                    id: row-deptName
                    body:
                      name: deptName
                      label: '@i18n:cell.NopAuthDept.deptName,prop.label.NopAuthDept.deptName|名称'
