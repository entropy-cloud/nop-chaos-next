                  - type: group
                    id: row-orderNum
                    body:
                      name: orderNum
                      label: '@i18n:cell.NopAuthDept.orderNum,prop.label.NopAuthDept.orderNum|排序'
                      type: input-text
                      validations: isInt
                  - type: group
                    id: row-deptType
                    body:
                      name: deptType
                      label: '@i18n:cell.NopAuthDept.deptType,prop.label.NopAuthDept.deptType|类型'
                      type: input-text
                      clearable: true
                      validations:
                        maxLength: 10
                        minLength: null
                        matchRegexp: null
                      transform:
                        upperCase: null
                        lowerCase: null
                  - type: group
                    id: row-managerId
                    body:
                      type: picker
                      valueField: userId
                      labelField: userName
                      size: lg
                      modalSize: lg
                      source:
                        valueField: userId
                        labelField: userName
                        url: '@query:NopAuthUser__active_findPage'
                        gql:selection: total,page,items{ id,userId,userName,nickName,dept{deptName},deptId,gender,gender_label,phone,userType,userType_label,status,status_label
                          }
                      pickerSchema:
                        name: crud-grid
                        syncLocation: false
                        footable: false
                        affixHeader: false
                        bulkActions: [
                          ]
                        itemActions: [
                          ]
                        headerToolbar:
                        - type: filter-toggler
                          id: filter-toggler
                        - type: bulkActions
                          id: bulkActions
                        - type: columns-toggler
                          align: right
                          id: columns-toggler
                        - type: reload
                          align: right
                          id: reload
