type: page
name: role-users
body:
  type: crud
  name: role-users-grid
  syncLocation: false
  footable: false
  affixHeader: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      data:
        roleId: ${'$'}{roleId}
        userIds: ${'$'}{ids}
      url: '@mutation:NopAuthRole__removeRoleUsers'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: select-user-button
    actionType: dialog
    dialog:
      type: page
      name: select-role-users
      title: '@i18n:common.selectUser'
      body:
        type: crud
        name: crud-grid
        syncLocation: false
        pickerMode: true
        multiple: true
        footable: false
        affixHeader: false
        bulkActions:
        - type: action
          id: batch-add-user-button
          actionType: ajax
          api:
            data:
              roleId: ${'$'}{roleId}
              userIds: ${'$'}{ids}
            url: '@mutation:NopAuthRole__addRoleUsers'
          batch: true
          close: select-role-users
          label: '@i18n:common.submit'
          level: primary
          reload: role-users-grid
        itemActions: [
          ]
        headerToolbar:
        - type: filter-toggler
          id: filter-toggler
        - type: bulkActions
          id: bulkActions
        - type: columns-toggler
          align: right
          id: columns-toggler
        - type: reload
          align: right
          id: reload
        footerToolbar:
        - type: statistics
          id: statistics
        - type: switch-per-page
          id: switch-per-page
        - type: pagination
          id: pagination
        api:
          url: '@query:NopAuthUser__active_findPage/total,page,items{ id,userId,userName,nickName,dept{deptName},deptId,gender,gender_label,phone,userType,userType_label,status,status_label
            }'
        labelTpl: ${userName}
        columns:
        - name: userName
          label: '@i18n:col.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
          sortable: true
          toggled: true
          fixed: left
          type: static
        - name: nickName
          label: '@i18n:col.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
          sortable: true
          toggled: true
          type: static
        - name: dept.deptName
          label: '@i18n:col.NopAuthUser.deptId,prop.label.NopAuthUser.deptId|所属部门'
          sortable: true
          toggled: true
          type: static
        - name: gender_label
          label: '@i18n:col.NopAuthUser.gender,prop.label.NopAuthUser.gender|性别'
          sortable: true
          toggled: true
          type: static
        - name: phone
          label: '@i18n:col.NopAuthUser.phone,prop.label.NopAuthUser.phone|电话'
          sortable: true
          toggled: true
          type: static
        - name: userType_label
          label: '@i18n:col.NopAuthUser.userType,prop.label.NopAuthUser.userType|用户类型'
          sortable: true
          toggled: true
          type: static
        - name: status_label
          label: '@i18n:col.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
          sortable: true
          toggled: true
          type: static
      size: md
      actions: [
        ]
    label: '@i18n:common.selectUser'
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthRole__get/items:roleUsers{id,userId,userName,nickName,status,status_label}?id=${''$''}{roleId}'
  labelTpl: ${userName}
  columns:
  - name: userName
    label: '@i18n:col.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
    sortable: false
    toggled: true
    fixed: left
    type: static
  - name: nickName
    label: '@i18n:col.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
    sortable: false
    toggled: true
    type: static
  - name: status_label
    label: '@i18n:col.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
    sortable: false
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons: [
      ]
