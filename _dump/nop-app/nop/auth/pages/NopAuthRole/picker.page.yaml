type: picker
valueField: id
labelField: roleName
size: lg
modalSize: lg
source:
  valueField: id
  labelField: roleName
  url: '@query:NopAuthRole__findPage'
  gql:selection: total,page,items{ id,roleId,roleName,isPrimary,createdBy,createTime,updatedBy,updateTime,remark
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthRole__findPage'
    gql:selection: total,page,items{ id,roleId,roleName,isPrimary,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${roleName}
  columns:
  - name: roleId
    label: '@i18n:col.NopAuthRole.roleId,prop.label.NopAuthRole.roleId|角色ID'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: roleName
    label: '@i18n:col.NopAuthRole.roleName,prop.label.NopAuthRole.roleName|角色名'
    sortable: true
    toggled: true
    type: static
  - name: isPrimary
    label: '@i18n:col.NopAuthRole.isPrimary,prop.label.NopAuthRole.isPrimary|是否主角色'
    sortable: true
    toggled: true
    align: center
    type: static-mapping
    map:
      '1': <span class='label label-success'>{@i18n:common.yes}</span>
      '0': <span class='label label-warning'>{@i18n:common.no}</span>
      'true': <span class='label label-success'>{@i18n:common.yes}</span>
      'false': <span class='label label-warning'>{@i18n:common.no}</span>
      ? ''
      : ''
  - name: createdBy
    label: '@i18n:col.NopAuthRole.createdBy,prop.label.NopAuthRole.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopAuthRole.createTime,prop.label.NopAuthRole.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopAuthRole.updatedBy,prop.label.NopAuthRole.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopAuthRole.updateTime,prop.label.NopAuthRole.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthRole.remark,prop.label.NopAuthRole.remark|备注'
    sortable: true
    toggled: true
    type: static
