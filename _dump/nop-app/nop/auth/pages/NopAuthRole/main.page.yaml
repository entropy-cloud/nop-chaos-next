type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopAuthRole__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: sm
      title: '@i18n:NopAuthRole.forms.add.$title|新增-角色'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopAuthRole__save/id'
        body:
        - type: group
          id: row-roleId
          body:
            name: roleId
            label: '@i18n:cell.NopAuthRole.roleId,prop.label.NopAuthRole.roleId|角色ID'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 50
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-roleName
          body:
            name: roleName
            label: '@i18n:cell.NopAuthRole.roleName,prop.label.NopAuthRole.roleName|角色名'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 50
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-isPrimary
          body:
            name: isPrimary
            label: '@i18n:cell.NopAuthRole.isPrimary,prop.label.NopAuthRole.isPrimary|是否主角色'
            type: switch
            trueValue: 1
            falseValue: 0
            value: '0'
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopAuthRole.remark,prop.label.NopAuthRole.remark|备注'
            type: textarea
            minRows: 3
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthRole__findPage'
    gql:selection: total,page,items{ id,roleId,roleName,isPrimary,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${roleName}
  columns:
  - name: roleId
    label: '@i18n:col.NopAuthRole.roleId,prop.label.NopAuthRole.roleId|角色ID'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: roleName
    label: '@i18n:col.NopAuthRole.roleName,prop.label.NopAuthRole.roleName|角色名'
    sortable: true
    toggled: true
    type: static
  - name: isPrimary
    label: '@i18n:col.NopAuthRole.isPrimary,prop.label.NopAuthRole.isPrimary|是否主角色'
    sortable: true
    toggled: true
    align: center
    type: static-mapping
    map:
      '1': <span class='label label-success'>{@i18n:common.yes}</span>
      '0': <span class='label label-warning'>{@i18n:common.no}</span>
      'true': <span class='label label-success'>{@i18n:common.yes}</span>
      'false': <span class='label label-warning'>{@i18n:common.no}</span>
      ? ''
      : ''
  - name: createdBy
    label: '@i18n:col.NopAuthRole.createdBy,prop.label.NopAuthRole.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopAuthRole.createTime,prop.label.NopAuthRole.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopAuthRole.updatedBy,prop.label.NopAuthRole.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopAuthRole.updateTime,prop.label.NopAuthRole.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthRole.remark,prop.label.NopAuthRole.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopAuthRole.forms.view.$title|查看-角色'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopAuthRole__get?id=$id'
            gql:selection: id,roleId,roleName,isPrimary,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-roleId
            body:
              name: roleId
              label: '@i18n:cell.NopAuthRole.roleId,prop.label.NopAuthRole.roleId|角色ID'
              required: true
              type: static
          - type: group
            id: row-roleName
            body:
              name: roleName
              label: '@i18n:cell.NopAuthRole.roleName,prop.label.NopAuthRole.roleName|角色名'
              required: true
              type: static
          - type: group
            id: row-isPrimary
            body:
              name: isPrimary
              label: '@i18n:cell.NopAuthRole.isPrimary,prop.label.NopAuthRole.isPrimary|是否主角色'
              type: static-mapping
              map:
                '1': <span class='label label-success'>{@i18n:common.yes}</span>
                '0': <span class='label label-warning'>{@i18n:common.no}</span>
                'true': <span class='label label-success'>{@i18n:common.yes}</span>
                'false': <span class='label label-warning'>{@i18n:common.no}</span>
                ? ''
                : ''
          - type: group
            id: row-createdBy
            body:
              name: createdBy
              label: '@i18n:cell.NopAuthRole.createdBy,prop.label.NopAuthRole.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime
            body:
              name: createTime
              label: '@i18n:cell.NopAuthRole.createTime,prop.label.NopAuthRole.createTime|创建时间'
              required: true
              type: static
          - type: group
            id: row-updatedBy
            body:
              name: updatedBy
              label: '@i18n:cell.NopAuthRole.updatedBy,prop.label.NopAuthRole.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime
            body:
              name: updateTime
              label: '@i18n:cell.NopAuthRole.updateTime,prop.label.NopAuthRole.updateTime|修改时间'
              required: true
              type: static
          - type: group
            id: row-remark
            body:
              name: remark
              label: '@i18n:cell.NopAuthRole.remark,prop.label.NopAuthRole.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: sm
          title: '@i18n:NopAuthRole.forms.edit.$title|编辑-角色'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopAuthRole__get?id=$id'
              gql:selection: id,roleId,roleName,isPrimary,remark
            api:
              data:
                roleId: $roleId
                roleName: $roleName
                isPrimary: $isPrimary
                remark: $remark
              url: '@mutation:NopAuthRole__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-roleId
              body:
                name: roleId
                label: '@i18n:cell.NopAuthRole.roleId,prop.label.NopAuthRole.roleId|角色ID'
                required: true
                type: static
            - type: group
              id: row-roleName
              body:
                name: roleName
                label: '@i18n:cell.NopAuthRole.roleName,prop.label.NopAuthRole.roleName|角色名'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 50
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-isPrimary
              body:
                name: isPrimary
                label: '@i18n:cell.NopAuthRole.isPrimary,prop.label.NopAuthRole.isPrimary|是否主角色'
                type: switch
                trueValue: 1
                falseValue: 0
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopAuthRole.remark,prop.label.NopAuthRole.remark|备注'
                type: textarea
                minRows: 3
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopAuthRole__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
      - actionType: drawer
        drawer:
          type: page
          name: role-users
          body:
            type: crud
            name: role-users-grid
            syncLocation: false
            footable: false
            affixHeader: false
            bulkActions:
            - type: action
              id: batch-delete-button
              actionType: ajax
              api:
                data:
                  roleId: ${'$'}{roleId}
                  userIds: ${'$'}{ids}
                url: '@mutation:NopAuthRole__removeRoleUsers'
              batch: true
              confirmText: '@i18n:common.confirmBatchDelete'
              label: '@i18n:common.batchDelete'
            itemActions: [
              ]
            headerToolbar:
            - type: filter-toggler
              id: filter-toggler
            - type: action
              id: select-user-button
              actionType: dialog
              dialog:
                type: page
                name: select-role-users
                title: '@i18n:common.selectUser'
                body:
                  type: crud
                  name: crud-grid
                  syncLocation: false
                  pickerMode: true
                  multiple: true
                  footable: false
                  affixHeader: false
                  bulkActions:
                  - type: action
                    id: batch-add-user-button
                    actionType: ajax
                    api:
                      data:
                        roleId: ${'$'}{roleId}
                        userIds: ${'$'}{ids}
                      url: '@mutation:NopAuthRole__addRoleUsers'
                    batch: true
                    close: select-role-users
                    label: '@i18n:common.submit'
                    level: primary
                    reload: role-users-grid
                  itemActions: [
                    ]
                  headerToolbar:
                  - type: filter-toggler
                    id: filter-toggler
                  - type: bulkActions
                    id: bulkActions
                  - type: columns-toggler
                    align: right
                    id: columns-toggler
                  - type: reload
                    align: right
                    id: reload
                  footerToolbar:
                  - type: statistics
                    id: statistics
                  - type: switch-per-page
                    id: switch-per-page
                  - type: pagination
                    id: pagination
                  api:
                    url: '@query:NopAuthUser__active_findPage/total,page,items{ id,userId,userName,nickName,dept{deptName},deptId,gender,gender_label,phone,userType,userType_label,status,status_label
                      }'
                  labelTpl: ${userName}
                  columns:
                  - name: userName
                    label: '@i18n:col.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
                    sortable: true
                    toggled: true
                    fixed: left
                    type: static
                  - name: nickName
                    label: '@i18n:col.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
                    sortable: true
                    toggled: true
                    type: static
                  - name: dept.deptName
                    label: '@i18n:col.NopAuthUser.deptId,prop.label.NopAuthUser.deptId|所属部门'
                    sortable: true
                    toggled: true
                    type: static
                  - name: gender_label
                    label: '@i18n:col.NopAuthUser.gender,prop.label.NopAuthUser.gender|性别'
                    sortable: true
                    toggled: true
                    type: static
                  - name: phone
                    label: '@i18n:col.NopAuthUser.phone,prop.label.NopAuthUser.phone|电话'
                    sortable: true
                    toggled: true
                    type: static
                  - name: userType_label
                    label: '@i18n:col.NopAuthUser.userType,prop.label.NopAuthUser.userType|用户类型'
                    sortable: true
                    toggled: true
                    type: static
                  - name: status_label
                    label: '@i18n:col.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
                    sortable: true
                    toggled: true
                    type: static
                size: md
                actions: [
                  ]
              label: '@i18n:common.selectUser'
            - type: bulkActions
              id: bulkActions
            - type: columns-toggler
              align: right
              id: columns-toggler
            - type: reload
              align: right
              id: reload
            footerToolbar:
            - type: statistics
              id: statistics
            - type: switch-per-page
              id: switch-per-page
            - type: pagination
              id: pagination
            api:
              url: '@query:NopAuthRole__get/items:roleUsers{id,userId,userName,nickName,status,status_label}?id=${''$''}{roleId}'
            labelTpl: ${userName}
            columns:
            - name: userName
              label: '@i18n:col.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
              sortable: false
              toggled: true
              fixed: left
              type: static
            - name: nickName
              label: '@i18n:col.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
              sortable: false
              toggled: true
              type: static
            - name: status_label
              label: '@i18n:col.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
              sortable: false
              toggled: true
              type: static
            - type: operation
              label: '@i18n:common.operation'
              id: operation
              width: 140
              toggled: true
              fixed: right
              labelClassName: text-center
              buttons: [
                ]
          actions: [
            ]
        id: row-user-button
        label: '@i18n:common.user'
        type: button
      - actionType: drawer
        drawer:
          type: page
          title: '@i18n:common.authorization'
          body:
          - type: form
            body:
            - label: '@i18n:prop.label.NopAuthResource.siteId|站点ID'
              required: true
              type: button-group-select
              multiple: false
              source: '@dict:obj/NopAuthSite'
              value: main
              name: siteId
            - type: service
              api:
                url: '@query:NopAuthRole__get/resourceIds:roleResourceIds'
                data:
                  id: ${'$'}{roleId}
              body:
                type: input-tree
                name: resourceIds
                multiple: true
                cascade: true
                label: false
                source:
                  url: '@query:NopAuthResource__findList/value:id,label:displayName,children
                    @TreeChildren(max:5)'
                  data:
                    filter_resourceType: TOPM
                    filter_siteId: ${'$'}{siteId}
                  trackExpression: ${'$'}{siteId}
            - type: wrapper
              body:
                type: button
                label: '@i18n:common.submit'
                level: primary
                actionType: ajax
                api:
                  url: '@mutation:NopAuthRole__updateRoleResources'
                  data:
                    siteId: ${'$'}{siteId}
                    resourceIds: ${'$'}{resourceIds}
                    roleId: ${'$'}{roleId}
          actions: [
            ]
        id: row-authorization-button
        label: '@i18n:common.authorization'
        type: button
xui:js: '@include:NopAuthRole.action.js'
