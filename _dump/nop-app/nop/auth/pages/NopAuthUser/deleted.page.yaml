type: page
name: deleted
body:
  type: crud
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthUser__deleted_findPage/total,page,items{ id,userId,userName,nickName,dept{deptName},deptId,gender,gender_label,phone,userType,userType_label,status,status_label
      }'
  labelTpl: ${userName}
  columns:
  - name: userName
    label: '@i18n:col.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: nickName
    label: '@i18n:col.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
    sortable: true
    toggled: true
    type: static
  - name: dept.deptName
    label: '@i18n:col.NopAuthUser.deptId,prop.label.NopAuthUser.deptId|所属部门'
    sortable: true
    toggled: true
    type: static
  - name: gender_label
    label: '@i18n:col.NopAuthUser.gender,prop.label.NopAuthUser.gender|性别'
    sortable: true
    toggled: true
    type: static
  - name: phone
    label: '@i18n:col.NopAuthUser.phone,prop.label.NopAuthUser.phone|电话'
    sortable: true
    toggled: true
    type: static
  - name: userType_label
    label: '@i18n:col.NopAuthUser.userType,prop.label.NopAuthUser.userType|用户类型'
    sortable: true
    toggled: true
    type: static
  - name: status_label
    label: '@i18n:col.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: recover-deleted-button
      actionType: ajax
      api:
        data:
          id: ${'$'}{id}
        url: '@mutation:NopAuthUser__recoverDeleted/id'
      confirmText: '@i18n:common.confirmRecoverDeleted'
      label: '@i18n:common.recoverDeleted'
