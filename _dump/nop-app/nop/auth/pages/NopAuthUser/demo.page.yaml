type: page
name: main
aside:
- type: form
  wrapWithPanel: false
  target: crud-grid
  name: aside
  submitOnChange: true
  rules: [
    ]
  body:
  - type: fieldSet
    id: dept
    collapsable: false
    collapsed: false
    title: '@i18n:forms.NopAuthUser.asideFilter.dept|部门'
    visibleOn: null
    body:
      type: group
      id: row-deptId
      body:
        name: filter_deptId
        placeholder: '@i18n:cell.NopAuthUser.deptId,prop.label.NopAuthUser.deptId|所属部门'
        label: false
        clearValueOnHidden: false
        submitOnChange: true
        type: input-tree
        source: '@query:NopAuthDept__findList/value:id,label:deptName,children @TreeChildren(max:5)?filter_parentId=__null'
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopAuthUser__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: lg
      title: '@i18n:NopAuthUser.forms.add.$title|新增-用户'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopAuthUser__save/id'
        body:
        - type: tabs
          id: add-tabs
          tabs:
          - title: '@i18n:forms.NopAuthUser.add.baseInfo|基本信息'
            name: baseInfo
            visibleOn: null
            tab:
            - type: group
              id: row-userName-status
              body:
              - name: userName
                label: '@i18n:cell.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 50
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
              - name: status
                label: '@i18n:cell.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
                required: true
                type: select
                searchable: true
                clearable: true
                multiple: false
                source: '@dict:auth/user-status'
            - type: group
              id: row-nickName-deptId
              body:
              - name: nickName
                label: '@i18n:cell.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 50
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
              - name: deptId
                label: '@i18n:cell.NopAuthUser.deptId,prop.label.NopAuthUser.deptId|所属部门'
                type: tree-select
                clearable: true
                source:
                  url: "@query:NopAuthDept__findList/value:id,label:deptName,\n  \
                    \                          children @TreeChildren(max:5)?filter_parentId=__null\n\
                    \                        "
            - type: group
              id: row-avatar
              body:
                name: avatar
                label: '@i18n:cell.NopAuthUser.avatar,prop.label.NopAuthUser.avatar|头像'
                type: input-file
                accept: image/*
                receiver: /f/upload?bizObjName=NopAuthUser&fieldName=avatar
                useChunk: false
            - type: group
              id: row-userType-gender
              body:
              - name: userType
                label: '@i18n:cell.NopAuthUser.userType,prop.label.NopAuthUser.userType|用户类型'
                required: true
                type: select
                searchable: true
                clearable: true
                multiple: false
                source: '@dict:auth/user-type'
              - name: gender
                label: '@i18n:cell.NopAuthUser.gender,prop.label.NopAuthUser.gender|性别'
                required: true
                type: select
                searchable: true
                clearable: true
                multiple: false
                source: '@dict:auth/gender'
            - type: group
              id: row-password-__password2
              body:
              - name: password
                label: '@i18n:cell.NopAuthUser.password,prop.label.NopAuthUser.password|密码'
                required: true
                type: input-password
              - name: __password2
                label: '@i18n:cell.NopAuthUser.__password2|重复密码'
                required: true
                clearValueOnHidden: false
                type: input-password
                validations:
                  equalsField: password
            - type: group
              id: row-email-phone
              body:
              - name: email
                label: '@i18n:cell.NopAuthUser.email,prop.label.NopAuthUser.email|邮件'
                type: input-text
                clearable: true
                validations:
                  isEmail: true
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
              - name: phone
                label: '@i18n:cell.NopAuthUser.phone,prop.label.NopAuthUser.phone|电话'
                type: input-text
                clearable: true
                validations:
                  isPhoneNumber: true
                  maxLength: 50
                  minLength: null
                  matchRegexp: null
            - type: group
              id: row-expireAt-changePwdAtLogin
              body:
              - name: expireAt
                label: '@i18n:cell.NopAuthUser.expireAt,prop.label.NopAuthUser.expireAt|用户过期时间'
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
              - name: changePwdAtLogin
                label: '@i18n:cell.NopAuthUser.changePwdAtLogin,prop.label.NopAuthUser.changePwdAtLogin|登陆后立刻修改密码'
                type: switch
                trueValue: 1
                falseValue: 0
                value: '0'
            - type: group
              id: row-tenantId
              body:
                name: tenantId
                label: '@i18n:cell.NopAuthUser.tenantId,prop.label.NopAuthUser.tenantId|租户ID'
                clearValueOnHidden: false
                type: select
                searchable: true
                clearable: true
                multiple: false
                source: '@dict:obj/NopAuthTenant'
          - title: '@i18n:forms.NopAuthUser.add.extInfo|扩展信息'
            name: extInfo
            visibleOn: null
            tab:
            - type: group
              id: row-idType-idNbr
              body:
              - name: idType
                label: '@i18n:cell.NopAuthUser.idType,prop.label.NopAuthUser.idType|证件类型'
                type: input-text
                clearable: true
                validations:
                  maxLength: 10
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
              - name: idNbr
                label: '@i18n:cell.NopAuthUser.idNbr,prop.label.NopAuthUser.idNbr|证件号'
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-birthday-workNo
              body:
              - name: birthday
                label: '@i18n:cell.NopAuthUser.birthday,prop.label.NopAuthUser.birthday|生日'
                type: input-date
                format: YYYY-MM-DD
              - name: workNo
                label: '@i18n:cell.NopAuthUser.workNo,prop.label.NopAuthUser.workNo|工号'
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-positionId-telephone
              body:
              - type: picker
                valueField: positionId
                labelField: name
                size: lg
                modalSize: lg
                source:
                  valueField: positionId
                  labelField: name
                  url: '@query:NopAuthPosition__findPage'
                  gql:selection: total,page,items{ id,positionId,name,createdBy,remark
                    }
                pickerSchema:
                  name: crud-grid
                  syncLocation: false
                  footable: false
                  bulkActions: [
                    ]
                  itemActions: [
                    ]
                  headerToolbar:
                  - type: filter-toggler
                    id: filter-toggler
                  - type: bulkActions
                    id: bulkActions
                  - type: columns-toggler
                    align: right
                    id: columns-toggler
                  - type: reload
                    align: right
                    id: reload
                  footerToolbar:
                  - type: statistics
                    id: statistics
                  - type: switch-per-page
                    id: switch-per-page
                  - type: pagination
                    id: pagination
                  api:
                    url: '@query:NopAuthPosition__findPage'
                    gql:selection: total,page,items{ id,positionId,name,createdBy,remark
                      }
                  labelTpl: ${name}
                  columns:
                  - name: name
                    label: '@i18n:col.NopAuthPosition.name,prop.label.NopAuthPosition.name|名称'
                    sortable: true
                    toggled: true
                    fixed: left
                    type: static
                  - name: createdBy
                    label: '@i18n:col.NopAuthPosition.createdBy,prop.label.NopAuthPosition.createdBy|创建人'
                    sortable: true
                    toggled: true
                    type: static
                  - name: remark
                    label: '@i18n:col.NopAuthPosition.remark,prop.label.NopAuthPosition.remark|备注'
                    sortable: true
                    toggled: true
                    type: static
                name: positionId
                label: '@i18n:cell.NopAuthUser.positionId,prop.label.NopAuthUser.positionId|职务'
                joinValues: false
                extractValue: true
                multiple: false
              - name: telephone
                label: '@i18n:cell.NopAuthUser.telephone,prop.label.NopAuthUser.telephone|座机'
                type: input-text
                clearable: true
                validations:
                  maxLength: 50
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopAuthUser.remark,prop.label.NopAuthUser.remark|备注'
                type: textarea
                minRows: 3
    icon: fa fa-plus pull-left
