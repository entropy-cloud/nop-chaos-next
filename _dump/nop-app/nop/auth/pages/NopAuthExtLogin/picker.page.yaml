type: picker
valueField: id
labelField: id
size: lg
modalSize: lg
source:
  valueField: id
  url: '@query:NopAuthExtLogin__findPage'
  gql:selection: total,page,items{ id,sid,loginType,loginType_label,extId,credential,verified,lastLoginTime,lastLoginIp
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthExtLogin__findPage'
    gql:selection: total,page,items{ id,sid,loginType,loginType_label,extId,credential,verified,lastLoginTime,lastLoginIp
      }
  columns:
  - name: loginType_label
    label: '@i18n:col.NopAuthExtLogin.loginType,prop.label.NopAuthExtLogin.loginType|登录类型'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: extId
    label: '@i18n:col.NopAuthExtLogin.extId,prop.label.NopAuthExtLogin.extId|登录标识'
    sortable: true
    toggled: true
    type: static
  - name: credential
    label: '@i18n:col.NopAuthExtLogin.credential,prop.label.NopAuthExtLogin.credential|登录密码'
    sortable: true
    toggled: true
    type: static
  - name: verified
    label: '@i18n:col.NopAuthExtLogin.verified,prop.label.NopAuthExtLogin.verified|是否已验证'
    sortable: true
    toggled: true
    type: static-mapping
    map:
      '1': <span class='label label-success'>{@i18n:common.yes}</span>
      '0': <span class='label label-warning'>{@i18n:common.no}</span>
      'true': <span class='label label-success'>{@i18n:common.yes}</span>
      'false': <span class='label label-warning'>{@i18n:common.no}</span>
      ? ''
      : ''
  - name: lastLoginTime
    label: '@i18n:col.NopAuthExtLogin.lastLoginTime,prop.label.NopAuthExtLogin.lastLoginTime|上次登录时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: lastLoginIp
    label: '@i18n:col.NopAuthExtLogin.lastLoginIp,prop.label.NopAuthExtLogin.lastLoginIp|上次登录IP'
    sortable: true
    toggled: true
    type: static
