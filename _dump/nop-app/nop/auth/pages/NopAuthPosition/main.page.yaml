type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopAuthPosition__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: sm
      title: '@i18n:NopAuthPosition.forms.add.$title|新增-岗位'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopAuthPosition__save/id'
        body:
        - type: group
          id: row-name
          body:
            name: name
            label: '@i18n:cell.NopAuthPosition.name,prop.label.NopAuthPosition.name|名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopAuthPosition.remark,prop.label.NopAuthPosition.remark|备注'
            type: textarea
            minRows: 3
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthPosition__findPage'
    gql:selection: total,page,items{ id,positionId,name,createdBy,remark }
  labelTpl: ${name}
  columns:
  - name: name
    label: '@i18n:col.NopAuthPosition.name,prop.label.NopAuthPosition.name|名称'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: createdBy
    label: '@i18n:col.NopAuthPosition.createdBy,prop.label.NopAuthPosition.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthPosition.remark,prop.label.NopAuthPosition.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopAuthPosition.forms.view.$title|查看-岗位'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopAuthPosition__get?id=$id'
            gql:selection: id,positionId,name,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-name
            body:
              name: name
              label: '@i18n:cell.NopAuthPosition.name,prop.label.NopAuthPosition.name|名称'
              required: true
              type: static
          - type: group
            id: row-createdBy
            body:
              name: createdBy
              label: '@i18n:cell.NopAuthPosition.createdBy,prop.label.NopAuthPosition.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime
            body:
              name: createTime
              label: '@i18n:cell.NopAuthPosition.createTime,prop.label.NopAuthPosition.createTime|创建时间'
              required: true
              type: static
          - type: group
            id: row-updatedBy
            body:
              name: updatedBy
              label: '@i18n:cell.NopAuthPosition.updatedBy,prop.label.NopAuthPosition.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime
            body:
              name: updateTime
              label: '@i18n:cell.NopAuthPosition.updateTime,prop.label.NopAuthPosition.updateTime|修改时间'
              required: true
              type: static
          - type: group
            id: row-remark
            body:
              name: remark
              label: '@i18n:cell.NopAuthPosition.remark,prop.label.NopAuthPosition.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: sm
          title: '@i18n:NopAuthPosition.forms.edit.$title|编辑-岗位'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopAuthPosition__get?id=$id'
              gql:selection: id,positionId,name,remark
            api:
              data:
                name: $name
                remark: $remark
              url: '@mutation:NopAuthPosition__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-name
              body:
                name: name
                label: '@i18n:cell.NopAuthPosition.name,prop.label.NopAuthPosition.name|名称'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopAuthPosition.remark,prop.label.NopAuthPosition.remark|备注'
                type: textarea
                minRows: 3
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopAuthPosition__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
