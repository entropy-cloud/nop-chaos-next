type: picker
valueField: id
labelField: name
size: lg
modalSize: lg
source:
  valueField: id
  labelField: name
  url: '@query:NopAuthPosition__findPage'
  gql:selection: total,page,items{ id,positionId,name,createdBy,remark }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopAuthPosition__findPage'
    gql:selection: total,page,items{ id,positionId,name,createdBy,remark }
  labelTpl: ${name}
  columns:
  - name: name
    label: '@i18n:col.NopAuthPosition.name,prop.label.NopAuthPosition.name|名称'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: createdBy
    label: '@i18n:col.NopAuthPosition.createdBy,prop.label.NopAuthPosition.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopAuthPosition.remark,prop.label.NopAuthPosition.remark|备注'
    sortable: true
    toggled: true
    type: static
