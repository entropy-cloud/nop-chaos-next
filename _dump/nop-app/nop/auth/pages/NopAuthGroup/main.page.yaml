type: page
name: main
body:
  type: crud
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopAuthGroup__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: sm
      title: '@i18n:NopAuthGroup.forms.add.$title|新增-用户组'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopAuthGroup__save/id'
        body:
        - type: group
          id: row-name
          body:
            name: name
            label: '@i18n:cell.NopAuthGroup.name,prop.label.NopAuthGroup.name|名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-parentId
          body:
            name: parentId
            label: '@i18n:cell.NopAuthGroup.parentId,prop.label.NopAuthGroup.parentId|父ID'
            type: tree-select
            clearable: true
            source:
              url: "@query:NopAuthGroup__findList/value:id,label:name,\n         \
                \                   children @TreeChildren(max:5)?filter_parentId=__null\n\
                \                        "
        - type: group
          id: row-ownerId
          body:
            type: picker
            valueField: userId
            labelField: userName
            size: lg
            modalSize: lg
            source:
              valueField: userId
              labelField: userName
              url: '@query:NopAuthUser__active_findPage'
              gql:selection: total,page,items{ id,userId,userName,nickName,dept{deptName},deptId,gender,gender_label,phone,userType,userType_label,status,status_label
                }
            pickerSchema:
              name: crud-grid
              syncLocation: false
              footable: false
              affixHeader: false
              bulkActions: [
                ]
              itemActions: [
                ]
              headerToolbar:
              - type: filter-toggler
                id: filter-toggler
              - type: bulkActions
                id: bulkActions
              - type: columns-toggler
                align: right
                id: columns-toggler
              - type: reload
                align: right
                id: reload
              footerToolbar:
              - type: statistics
                id: statistics
              - type: switch-per-page
                id: switch-per-page
              - type: pagination
                id: pagination
              api:
                url: '@query:NopAuthUser__active_findPage'
                gql:selection: total,page,items{ id,userId,userName,nickName,dept{deptName},deptId,gender,gender_label,phone,userType,userType_label,status,status_label
                  }
              labelTpl: ${userName}
              filter:
                id: crud-filter
                mode: horizontal
                rules: [
                  ]
                body:
                - type: group
                  id: row-userName-gender-status
                  body:
                  - name: filter_userName__contains
                    label: '@i18n:cell.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
                    type: input-text
                    clearable: true
                  - name: filter_gender
                    label: '@i18n:cell.NopAuthUser.gender,prop.label.NopAuthUser.gender|性别'
                    type: select
                    searchable: true
                    clearable: true
                    multiple: false
                    source: '@dict:auth/gender'
                  - name: filter_status
                    label: '@i18n:cell.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
                    type: select
                    searchable: true
                    clearable: true
                    multiple: false
                    source: '@dict:auth/user-status'
                - type: group
                  id: row-nickName-phone
                  body:
                  - name: filter_nickName
                    label: '@i18n:cell.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
                    type: input-text
                    clearable: true
                  - name: filter_phone
                    label: '@i18n:cell.NopAuthUser.phone,prop.label.NopAuthUser.phone|电话'
                    type: input-text
                    clearable: true
                actions:
                - type: reset
                  label: '@i18n:common.reset'
                  id: reset-button
                - type: submit
                  label: '@i18n:common.query'
                  level: primary
                  id: submit-button
              columns:
              - name: userName
                label: '@i18n:col.NopAuthUser.userName,prop.label.NopAuthUser.userName|用户名'
                sortable: true
                toggled: true
                fixed: left
                type: static
              - name: nickName
                label: '@i18n:col.NopAuthUser.nickName,prop.label.NopAuthUser.nickName|昵称'
                sortable: true
                toggled: true
                type: static
              - name: dept.deptName
                label: '@i18n:col.NopAuthUser.deptId,prop.label.NopAuthUser.deptId|所属部门'
                sortable: true
                toggled: true
                type: static
              - name: gender_label
                label: '@i18n:col.NopAuthUser.gender,prop.label.NopAuthUser.gender|性别'
                sortable: true
                toggled: true
                type: static
              - name: phone
                label: '@i18n:col.NopAuthUser.phone,prop.label.NopAuthUser.phone|电话'
                sortable: true
                toggled: true
                type: static
              - name: userType_label
                label: '@i18n:col.NopAuthUser.userType,prop.label.NopAuthUser.userType|用户类型'
                sortable: true
                toggled: true
                type: static
              - name: status_label
                label: '@i18n:col.NopAuthUser.status,prop.label.NopAuthUser.status|用户状态'
                sortable: true
                toggled: true
                type: static
            name: ownerId
            label: '@i18n:cell.NopAuthGroup.ownerId,prop.label.NopAuthGroup.ownerId|所有者ID'
            joinValues: false
            extractValue: true
            multiple: false
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopAuthGroup.remark,prop.label.NopAuthGroup.remark|备注'
            type: textarea
            minRows: 3
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  api:
    url: '@query:NopAuthGroup__findList?filter_parentId=__null'
