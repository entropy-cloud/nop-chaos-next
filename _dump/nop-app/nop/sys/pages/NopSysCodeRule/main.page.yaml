type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysCodeRule__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: md
      title: '@i18n:NopSysCodeRule.forms.add.$title|新增-编码规则'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysCodeRule__save/id'
        body:
        - type: group
          id: row-sid
          body:
            name: sid
            label: '@i18n:cell.NopSysCodeRule.sid,prop.label.NopSysCodeRule.sid|主键'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 32
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-name
          body:
            name: name
            label: '@i18n:cell.NopSysCodeRule.name,prop.label.NopSysCodeRule.name|名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-displayName
          body:
            name: displayName
            label: '@i18n:cell.NopSysCodeRule.displayName,prop.label.NopSysCodeRule.displayName|显示名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-codePattern
          body:
            name: codePattern
            label: '@i18n:cell.NopSysCodeRule.codePattern,prop.label.NopSysCodeRule.codePattern|编码模式'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-seqName
          body:
            name: seqName
            label: '@i18n:cell.NopSysCodeRule.seqName,prop.label.NopSysCodeRule.seqName|序列号名称'
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopSysCodeRule.remark,prop.label.NopSysCodeRule.remark|备注'
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysCodeRule__findPage'
    gql:selection: total,page,items{ id,sid,name,displayName,codePattern,seqName,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${displayName}
  columns:
  - name: sid
    label: '@i18n:col.NopSysCodeRule.sid,prop.label.NopSysCodeRule.sid|主键'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: name
    label: '@i18n:col.NopSysCodeRule.name,prop.label.NopSysCodeRule.name|名称'
    sortable: true
    toggled: true
    type: static
  - name: displayName
    label: '@i18n:col.NopSysCodeRule.displayName,prop.label.NopSysCodeRule.displayName|显示名称'
    sortable: true
    toggled: true
    type: static
  - name: codePattern
    label: '@i18n:col.NopSysCodeRule.codePattern,prop.label.NopSysCodeRule.codePattern|编码模式'
    sortable: true
    toggled: true
    type: static
  - name: seqName
    label: '@i18n:col.NopSysCodeRule.seqName,prop.label.NopSysCodeRule.seqName|序列号名称'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysCodeRule.createdBy,prop.label.NopSysCodeRule.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysCodeRule.createTime,prop.label.NopSysCodeRule.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysCodeRule.updatedBy,prop.label.NopSysCodeRule.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysCodeRule.updateTime,prop.label.NopSysCodeRule.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysCodeRule.remark,prop.label.NopSysCodeRule.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysCodeRule.forms.view.$title|查看-编码规则'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysCodeRule__get?id=$id'
            gql:selection: id,sid,name,displayName,codePattern,seqName,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-sid-name
            body:
            - name: sid
              label: '@i18n:cell.NopSysCodeRule.sid,prop.label.NopSysCodeRule.sid|主键'
              required: true
              type: static
            - name: name
              label: '@i18n:cell.NopSysCodeRule.name,prop.label.NopSysCodeRule.name|名称'
              required: true
              type: static
          - type: group
            id: row-displayName-codePattern
            body:
            - name: displayName
              label: '@i18n:cell.NopSysCodeRule.displayName,prop.label.NopSysCodeRule.displayName|显示名称'
              required: true
              type: static
            - name: codePattern
              label: '@i18n:cell.NopSysCodeRule.codePattern,prop.label.NopSysCodeRule.codePattern|编码模式'
              required: true
              type: static
          - type: group
            id: row-seqName-createdBy
            body:
            - name: seqName
              label: '@i18n:cell.NopSysCodeRule.seqName,prop.label.NopSysCodeRule.seqName|序列号名称'
              type: static
            - name: createdBy
              label: '@i18n:cell.NopSysCodeRule.createdBy,prop.label.NopSysCodeRule.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime-updatedBy
            body:
            - name: createTime
              label: '@i18n:cell.NopSysCodeRule.createTime,prop.label.NopSysCodeRule.createTime|创建时间'
              required: true
              type: static
            - name: updatedBy
              label: '@i18n:cell.NopSysCodeRule.updatedBy,prop.label.NopSysCodeRule.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime-remark
            body:
            - name: updateTime
              label: '@i18n:cell.NopSysCodeRule.updateTime,prop.label.NopSysCodeRule.updateTime|修改时间'
              required: true
              type: static
            - name: remark
              label: '@i18n:cell.NopSysCodeRule.remark,prop.label.NopSysCodeRule.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: md
          title: '@i18n:NopSysCodeRule.forms.edit.$title|编辑-编码规则'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopSysCodeRule__get?id=$id'
              gql:selection: id,sid,name,displayName,codePattern,seqName,remark
            api:
              data:
                sid: $sid
                name: $name
                displayName: $displayName
                codePattern: $codePattern
                seqName: $seqName
                remark: $remark
              url: '@mutation:NopSysCodeRule__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-sid
              body:
                name: sid
                label: '@i18n:cell.NopSysCodeRule.sid,prop.label.NopSysCodeRule.sid|主键'
                required: true
                type: static
            - type: group
              id: row-name
              body:
                name: name
                label: '@i18n:cell.NopSysCodeRule.name,prop.label.NopSysCodeRule.name|名称'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-displayName
              body:
                name: displayName
                label: '@i18n:cell.NopSysCodeRule.displayName,prop.label.NopSysCodeRule.displayName|显示名称'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-codePattern
              body:
                name: codePattern
                label: '@i18n:cell.NopSysCodeRule.codePattern,prop.label.NopSysCodeRule.codePattern|编码模式'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 200
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-seqName
              body:
                name: seqName
                label: '@i18n:cell.NopSysCodeRule.seqName,prop.label.NopSysCodeRule.seqName|序列号名称'
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopSysCodeRule.remark,prop.label.NopSysCodeRule.remark|备注'
                type: input-text
                clearable: true
                validations:
                  maxLength: 200
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopSysCodeRule__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
