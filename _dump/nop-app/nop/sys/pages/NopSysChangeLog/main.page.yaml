type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysChangeLog__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysChangeLog__findPage'
    gql:selection: total,page,items{ id,sid,bizObjName,objId,bizKey,operationName,propName,oldValue,newValue,changeTime,appId,operatorId,approverId
      }
  columns:
  - name: sid
    label: '@i18n:col.NopSysChangeLog.sid,prop.label.NopSysChangeLog.sid|主键'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: bizObjName
    label: '@i18n:col.NopSysChangeLog.bizObjName,prop.label.NopSysChangeLog.bizObjName|业务对象'
    sortable: true
    toggled: true
    type: static
  - name: objId
    label: '@i18n:col.NopSysChangeLog.objId,prop.label.NopSysChangeLog.objId|对象ID'
    sortable: true
    toggled: true
    type: static
  - name: bizKey
    label: '@i18n:col.NopSysChangeLog.bizKey,prop.label.NopSysChangeLog.bizKey|业务键'
    sortable: true
    toggled: true
    type: static
  - name: operationName
    label: '@i18n:col.NopSysChangeLog.operationName,prop.label.NopSysChangeLog.operationName|业务操作'
    sortable: true
    toggled: true
    type: static
  - name: propName
    label: '@i18n:col.NopSysChangeLog.propName,prop.label.NopSysChangeLog.propName|属性名'
    sortable: true
    toggled: true
    type: static
  - name: oldValue
    label: '@i18n:col.NopSysChangeLog.oldValue,prop.label.NopSysChangeLog.oldValue|旧值'
    sortable: true
    toggled: true
    type: static
  - name: newValue
    label: '@i18n:col.NopSysChangeLog.newValue,prop.label.NopSysChangeLog.newValue|新值'
    sortable: true
    toggled: true
    type: static
  - name: changeTime
    label: '@i18n:col.NopSysChangeLog.changeTime,prop.label.NopSysChangeLog.changeTime|变更时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: appId
    label: '@i18n:col.NopSysChangeLog.appId,prop.label.NopSysChangeLog.appId|应用ID'
    sortable: true
    toggled: true
    type: static
  - name: operatorId
    label: '@i18n:col.NopSysChangeLog.operatorId,prop.label.NopSysChangeLog.operatorId|操作人'
    sortable: true
    toggled: true
    type: static
  - name: approverId
    label: '@i18n:col.NopSysChangeLog.approverId,prop.label.NopSysChangeLog.approverId|审核人'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysChangeLog.forms.view.$title|查看-变更跟踪日志'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysChangeLog__get?id=$id'
            gql:selection: id,sid,bizObjName,objId,bizKey,operationName,propName,oldValue,newValue,changeTime,appId,operatorId,approverId
          body:
          - type: group
            id: row-sid-bizObjName
            body:
            - name: sid
              label: '@i18n:cell.NopSysChangeLog.sid,prop.label.NopSysChangeLog.sid|主键'
              required: true
              type: static
            - name: bizObjName
              label: '@i18n:cell.NopSysChangeLog.bizObjName,prop.label.NopSysChangeLog.bizObjName|业务对象'
              required: true
              type: static
          - type: group
            id: row-objId-bizKey
            body:
            - name: objId
              label: '@i18n:cell.NopSysChangeLog.objId,prop.label.NopSysChangeLog.objId|对象ID'
              required: true
              type: static
            - name: bizKey
              label: '@i18n:cell.NopSysChangeLog.bizKey,prop.label.NopSysChangeLog.bizKey|业务键'
              type: static
          - type: group
            id: row-operationName-propName
            body:
            - name: operationName
              label: '@i18n:cell.NopSysChangeLog.operationName,prop.label.NopSysChangeLog.operationName|业务操作'
              required: true
              type: static
            - name: propName
              label: '@i18n:cell.NopSysChangeLog.propName,prop.label.NopSysChangeLog.propName|属性名'
              required: true
              type: static
          - type: group
            id: row-oldValue-newValue
            body:
            - name: oldValue
              label: '@i18n:cell.NopSysChangeLog.oldValue,prop.label.NopSysChangeLog.oldValue|旧值'
              type: static
            - name: newValue
              label: '@i18n:cell.NopSysChangeLog.newValue,prop.label.NopSysChangeLog.newValue|新值'
              type: static
          - type: group
            id: row-changeTime-appId
            body:
            - name: changeTime
              label: '@i18n:cell.NopSysChangeLog.changeTime,prop.label.NopSysChangeLog.changeTime|变更时间'
              required: true
              type: static
            - name: appId
              label: '@i18n:cell.NopSysChangeLog.appId,prop.label.NopSysChangeLog.appId|应用ID'
              type: static
          - type: group
            id: row-operatorId-approverId
            body:
            - name: operatorId
              label: '@i18n:cell.NopSysChangeLog.operatorId,prop.label.NopSysChangeLog.operatorId|操作人'
              required: true
              type: static
            - name: approverId
              label: '@i18n:cell.NopSysChangeLog.approverId,prop.label.NopSysChangeLog.approverId|审核人'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: ajax
        api:
          url: '@mutation:NopSysChangeLog__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
