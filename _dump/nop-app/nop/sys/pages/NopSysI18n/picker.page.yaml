type: picker
valueField: id
labelField: id
size: lg
modalSize: lg
source:
  valueField: id
  url: '@query:NopSysI18n__findPage'
  gql:selection: total,page,items{ id,i18nKey,i18nLocale,i18nLocale_label,value,createdBy,createTime,updatedBy,updateTime,remark
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysI18n__findPage'
    gql:selection: total,page,items{ id,i18nKey,i18nLocale,i18nLocale_label,value,createdBy,createTime,updatedBy,updateTime,remark
      }
  columns:
  - name: i18nKey
    label: '@i18n:col.NopSysI18n.i18nKey,prop.label.NopSysI18n.i18nKey|字符串Key'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: i18nLocale_label
    label: '@i18n:col.NopSysI18n.i18nLocale,prop.label.NopSysI18n.i18nLocale|语言'
    sortable: true
    toggled: true
    type: static
  - name: value
    label: '@i18n:col.NopSysI18n.value,prop.label.NopSysI18n.value|值'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysI18n.createdBy,prop.label.NopSysI18n.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysI18n.createTime,prop.label.NopSysI18n.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysI18n.updatedBy,prop.label.NopSysI18n.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysI18n.updateTime,prop.label.NopSysI18n.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysI18n.remark,prop.label.NopSysI18n.remark|备注'
    sortable: true
    toggled: true
    type: static
