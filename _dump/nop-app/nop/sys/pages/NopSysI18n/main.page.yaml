type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysI18n__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: sm
      title: '@i18n:NopSysI18n.forms.add.$title|新增-多语言消息'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysI18n__save/id'
        body:
        - type: group
          id: row-i18nKey
          body:
            name: i18nKey
            label: '@i18n:cell.NopSysI18n.i18nKey,prop.label.NopSysI18n.i18nKey|字符串Key'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-i18nLocale
          body:
            name: i18nLocale
            label: '@i18n:cell.NopSysI18n.i18nLocale,prop.label.NopSysI18n.i18nLocale|语言'
            required: true
            type: select
            searchable: true
            clearable: true
            multiple: false
            source: '@dict:core/enabled-locale'
        - type: group
          id: row-value
          body:
            name: value
            label: '@i18n:cell.NopSysI18n.value,prop.label.NopSysI18n.value|值'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 300
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopSysI18n.remark,prop.label.NopSysI18n.remark|备注'
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysI18n__findPage'
    gql:selection: total,page,items{ id,i18nKey,i18nLocale,i18nLocale_label,value,createdBy,createTime,updatedBy,updateTime,remark
      }
  columns:
  - name: i18nKey
    label: '@i18n:col.NopSysI18n.i18nKey,prop.label.NopSysI18n.i18nKey|字符串Key'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: i18nLocale_label
    label: '@i18n:col.NopSysI18n.i18nLocale,prop.label.NopSysI18n.i18nLocale|语言'
    sortable: true
    toggled: true
    type: static
  - name: value
    label: '@i18n:col.NopSysI18n.value,prop.label.NopSysI18n.value|值'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysI18n.createdBy,prop.label.NopSysI18n.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysI18n.createTime,prop.label.NopSysI18n.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysI18n.updatedBy,prop.label.NopSysI18n.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysI18n.updateTime,prop.label.NopSysI18n.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysI18n.remark,prop.label.NopSysI18n.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysI18n.forms.view.$title|查看-多语言消息'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysI18n__get?id=$id'
            gql:selection: id,i18nKey,i18nLocale,i18nLocale_label,value,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-i18nKey
            body:
              name: i18nKey
              label: '@i18n:cell.NopSysI18n.i18nKey,prop.label.NopSysI18n.i18nKey|字符串Key'
              required: true
              type: static
          - type: group
            id: row-i18nLocale
            body:
              name: i18nLocale_label
              label: '@i18n:cell.NopSysI18n.i18nLocale,prop.label.NopSysI18n.i18nLocale|语言'
              required: true
              type: static
          - type: group
            id: row-value
            body:
              name: value
              label: '@i18n:cell.NopSysI18n.value,prop.label.NopSysI18n.value|值'
              required: true
              type: static
          - type: group
            id: row-createdBy
            body:
              name: createdBy
              label: '@i18n:cell.NopSysI18n.createdBy,prop.label.NopSysI18n.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime
            body:
              name: createTime
              label: '@i18n:cell.NopSysI18n.createTime,prop.label.NopSysI18n.createTime|创建时间'
              required: true
              type: static
          - type: group
            id: row-updatedBy
            body:
              name: updatedBy
              label: '@i18n:cell.NopSysI18n.updatedBy,prop.label.NopSysI18n.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime
            body:
              name: updateTime
              label: '@i18n:cell.NopSysI18n.updateTime,prop.label.NopSysI18n.updateTime|修改时间'
              required: true
              type: static
          - type: group
            id: row-remark
            body:
              name: remark
              label: '@i18n:cell.NopSysI18n.remark,prop.label.NopSysI18n.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: sm
          title: '@i18n:NopSysI18n.forms.edit.$title|编辑-多语言消息'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopSysI18n__get?id=$id'
              gql:selection: id,i18nKey,i18nLocale,i18nLocale_label,value,remark
            api:
              data:
                i18nKey: $i18nKey
                i18nLocale: $i18nLocale
                value: $value
                remark: $remark
              url: '@mutation:NopSysI18n__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-i18nKey
              body:
                name: i18nKey
                label: '@i18n:cell.NopSysI18n.i18nKey,prop.label.NopSysI18n.i18nKey|字符串Key'
                required: true
                type: static
            - type: group
              id: row-i18nLocale
              body:
                name: i18nLocale_label
                label: '@i18n:cell.NopSysI18n.i18nLocale,prop.label.NopSysI18n.i18nLocale|语言'
                required: true
                type: static
            - type: group
              id: row-value
              body:
                name: value
                label: '@i18n:cell.NopSysI18n.value,prop.label.NopSysI18n.value|值'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 300
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopSysI18n.remark,prop.label.NopSysI18n.remark|备注'
                type: input-text
                clearable: true
                validations:
                  maxLength: 200
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopSysI18n__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
