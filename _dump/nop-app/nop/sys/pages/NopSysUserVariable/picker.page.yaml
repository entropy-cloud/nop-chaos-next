type: picker
valueField: id
labelField: varName
size: lg
modalSize: lg
source:
  valueField: id
  labelField: varName
  url: '@query:NopSysUserVariable__findPage'
  gql:selection: total,page,items{ id,userId,varName,varValue,stdDomain,varType,varType_label,createTime,updateTime,remark
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysUserVariable__findPage'
    gql:selection: total,page,items{ id,userId,varName,varValue,stdDomain,varType,varType_label,createTime,updateTime,remark
      }
  labelTpl: ${varName}
  columns:
  - name: varName
    label: '@i18n:col.NopSysUserVariable.varName,prop.label.NopSysUserVariable.varName|变量名'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: varValue
    label: '@i18n:col.NopSysUserVariable.varValue,prop.label.NopSysUserVariable.varValue|变量值'
    sortable: true
    toggled: true
    type: static
  - name: stdDomain
    label: '@i18n:col.NopSysUserVariable.stdDomain,prop.label.NopSysUserVariable.stdDomain|变量域'
    sortable: true
    toggled: true
    type: static
  - name: varType_label
    label: '@i18n:col.NopSysUserVariable.varType,prop.label.NopSysUserVariable.varType|变量类型'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysUserVariable.createTime,prop.label.NopSysUserVariable.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysUserVariable.updateTime,prop.label.NopSysUserVariable.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysUserVariable.remark,prop.label.NopSysUserVariable.remark|备注'
    sortable: true
    toggled: true
    type: static
