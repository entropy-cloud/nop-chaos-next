type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysClusterLeader__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: md
      title: '@i18n:NopSysClusterLeader.forms.add.$title|新增-集群选举'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysClusterLeader__save/id'
        body:
        - type: group
          id: row-clusterId
          body:
            name: clusterId
            label: '@i18n:cell.NopSysClusterLeader.clusterId,prop.label.NopSysClusterLeader.clusterId|集群ID'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-leaderId
          body:
            name: leaderId
            label: '@i18n:cell.NopSysClusterLeader.leaderId,prop.label.NopSysClusterLeader.leaderId|主服务器ID'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-leaderAdder
          body:
            name: leaderAdder
            label: '@i18n:cell.NopSysClusterLeader.leaderAdder,prop.label.NopSysClusterLeader.leaderAdder|主服务器地址'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-leaderEpoch
          body:
            name: leaderEpoch
            label: '@i18n:cell.NopSysClusterLeader.leaderEpoch,prop.label.NopSysClusterLeader.leaderEpoch|选举世代'
            required: true
            type: input-text
            validations: isInt
        - type: group
          id: row-electTime
          body:
            name: electTime
            label: '@i18n:cell.NopSysClusterLeader.electTime,prop.label.NopSysClusterLeader.electTime|选举时间'
            required: true
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-expireAt
          body:
            name: expireAt
            label: '@i18n:cell.NopSysClusterLeader.expireAt,prop.label.NopSysClusterLeader.expireAt|过期时间'
            required: true
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-refreshTime
          body:
            name: refreshTime
            label: '@i18n:cell.NopSysClusterLeader.refreshTime,prop.label.NopSysClusterLeader.refreshTime|刷新时间'
            required: true
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-appName
          body:
            name: appName
            label: '@i18n:cell.NopSysClusterLeader.appName,prop.label.NopSysClusterLeader.appName|应用名'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysClusterLeader__findPage'
    gql:selection: total,page,items{ id,clusterId,leaderId,leaderAdder,leaderEpoch,electTime,expireAt,refreshTime,appName
      }
  columns:
  - name: clusterId
    label: '@i18n:col.NopSysClusterLeader.clusterId,prop.label.NopSysClusterLeader.clusterId|集群ID'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: leaderId
    label: '@i18n:col.NopSysClusterLeader.leaderId,prop.label.NopSysClusterLeader.leaderId|主服务器ID'
    sortable: true
    toggled: true
    type: static
  - name: leaderAdder
    label: '@i18n:col.NopSysClusterLeader.leaderAdder,prop.label.NopSysClusterLeader.leaderAdder|主服务器地址'
    sortable: true
    toggled: true
    type: static
  - name: leaderEpoch
    label: '@i18n:col.NopSysClusterLeader.leaderEpoch,prop.label.NopSysClusterLeader.leaderEpoch|选举世代'
    sortable: true
    toggled: true
    type: static
  - name: electTime
    label: '@i18n:col.NopSysClusterLeader.electTime,prop.label.NopSysClusterLeader.electTime|选举时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: expireAt
    label: '@i18n:col.NopSysClusterLeader.expireAt,prop.label.NopSysClusterLeader.expireAt|过期时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: refreshTime
    label: '@i18n:col.NopSysClusterLeader.refreshTime,prop.label.NopSysClusterLeader.refreshTime|刷新时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: appName
    label: '@i18n:col.NopSysClusterLeader.appName,prop.label.NopSysClusterLeader.appName|应用名'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysClusterLeader.forms.view.$title|查看-集群选举'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysClusterLeader__get?id=$id'
            gql:selection: id,clusterId,leaderId,leaderAdder,leaderEpoch,electTime,expireAt,refreshTime,appName
          body:
          - type: group
            id: row-clusterId
            body:
              name: clusterId
              label: '@i18n:cell.NopSysClusterLeader.clusterId,prop.label.NopSysClusterLeader.clusterId|集群ID'
              required: true
              type: static
          - type: group
            id: row-leaderId
            body:
              name: leaderId
              label: '@i18n:cell.NopSysClusterLeader.leaderId,prop.label.NopSysClusterLeader.leaderId|主服务器ID'
              required: true
              type: static
          - type: group
            id: row-leaderAdder
            body:
              name: leaderAdder
              label: '@i18n:cell.NopSysClusterLeader.leaderAdder,prop.label.NopSysClusterLeader.leaderAdder|主服务器地址'
              required: true
              type: static
          - type: group
            id: row-leaderEpoch
            body:
              name: leaderEpoch
              label: '@i18n:cell.NopSysClusterLeader.leaderEpoch,prop.label.NopSysClusterLeader.leaderEpoch|选举世代'
              required: true
              type: static
          - type: group
            id: row-electTime
            body:
              name: electTime
              label: '@i18n:cell.NopSysClusterLeader.electTime,prop.label.NopSysClusterLeader.electTime|选举时间'
              required: true
              type: static
          - type: group
            id: row-expireAt
            body:
              name: expireAt
              label: '@i18n:cell.NopSysClusterLeader.expireAt,prop.label.NopSysClusterLeader.expireAt|过期时间'
              required: true
              type: static
          - type: group
            id: row-refreshTime
            body:
              name: refreshTime
              label: '@i18n:cell.NopSysClusterLeader.refreshTime,prop.label.NopSysClusterLeader.refreshTime|刷新时间'
              required: true
              type: static
          - type: group
            id: row-appName
            body:
              name: appName
              label: '@i18n:cell.NopSysClusterLeader.appName,prop.label.NopSysClusterLeader.appName|应用名'
              required: true
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: md
          title: '@i18n:NopSysClusterLeader.forms.edit.$title|编辑-集群选举'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopSysClusterLeader__get?id=$id'
              gql:selection: id,clusterId,leaderId,leaderAdder,leaderEpoch,electTime,expireAt,refreshTime,appName
            api:
              data:
                clusterId: $clusterId
                leaderId: $leaderId
                leaderAdder: $leaderAdder
                leaderEpoch: $leaderEpoch
                electTime: $electTime
                expireAt: $expireAt
                refreshTime: $refreshTime
                appName: $appName
              url: '@mutation:NopSysClusterLeader__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-clusterId
              body:
                name: clusterId
                label: '@i18n:cell.NopSysClusterLeader.clusterId,prop.label.NopSysClusterLeader.clusterId|集群ID'
                required: true
                type: static
            - type: group
              id: row-leaderId
              body:
                name: leaderId
                label: '@i18n:cell.NopSysClusterLeader.leaderId,prop.label.NopSysClusterLeader.leaderId|主服务器ID'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-leaderAdder
              body:
                name: leaderAdder
                label: '@i18n:cell.NopSysClusterLeader.leaderAdder,prop.label.NopSysClusterLeader.leaderAdder|主服务器地址'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-leaderEpoch
              body:
                name: leaderEpoch
                label: '@i18n:cell.NopSysClusterLeader.leaderEpoch,prop.label.NopSysClusterLeader.leaderEpoch|选举世代'
                required: true
                type: input-text
                validations: isInt
            - type: group
              id: row-electTime
              body:
                name: electTime
                label: '@i18n:cell.NopSysClusterLeader.electTime,prop.label.NopSysClusterLeader.electTime|选举时间'
                required: true
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-expireAt
              body:
                name: expireAt
                label: '@i18n:cell.NopSysClusterLeader.expireAt,prop.label.NopSysClusterLeader.expireAt|过期时间'
                required: true
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-refreshTime
              body:
                name: refreshTime
                label: '@i18n:cell.NopSysClusterLeader.refreshTime,prop.label.NopSysClusterLeader.refreshTime|刷新时间'
                required: true
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-appName
              body:
                name: appName
                label: '@i18n:cell.NopSysClusterLeader.appName,prop.label.NopSysClusterLeader.appName|应用名'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopSysClusterLeader__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
