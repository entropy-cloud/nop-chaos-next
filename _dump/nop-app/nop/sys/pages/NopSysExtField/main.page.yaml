type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysExtField__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: md
      title: '@i18n:NopSysExtField.forms.add.$title|新增-扩展字段'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysExtField__save/id'
        body:
        - type: group
          id: row-entityName-entityId
          body:
          - name: entityName
            label: '@i18n:cell.NopSysExtField.entityName,prop.label.NopSysExtField.entityName|实体名'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
          - name: entityId
            label: '@i18n:cell.NopSysExtField.entityId,prop.label.NopSysExtField.entityId|实体ID'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-fieldName-fieldType
          body:
          - name: fieldName
            label: '@i18n:cell.NopSysExtField.fieldName,prop.label.NopSysExtField.fieldName|字段名'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
          - name: fieldType
            label: '@i18n:cell.NopSysExtField.fieldType,prop.label.NopSysExtField.fieldType|字段类型'
            required: true
            type: input-text
            validations: isInt
        - type: group
          id: row-decimalScale-decimalValue
          body:
          - name: decimalScale
            label: '@i18n:cell.NopSysExtField.decimalScale,prop.label.NopSysExtField.decimalScale|浮点精度'
            type: input-text
            validations: isInt
          - name: decimalValue
            label: '@i18n:cell.NopSysExtField.decimalValue,prop.label.NopSysExtField.decimalValue|浮点值'
            type: input-number
            precision: 8
        - type: group
          id: row-dateValue-timestampValue
          body:
          - name: dateValue
            label: '@i18n:cell.NopSysExtField.dateValue,prop.label.NopSysExtField.dateValue|日期值'
            type: input-date
            format: YYYY-MM-DD
          - name: timestampValue
            label: '@i18n:cell.NopSysExtField.timestampValue,prop.label.NopSysExtField.timestampValue|时间点值'
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-stringValue-remark
          body:
          - name: stringValue
            label: '@i18n:cell.NopSysExtField.stringValue,prop.label.NopSysExtField.stringValue|字符串值'
            type: input-text
            clearable: true
            validations:
              maxLength: 4000
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
          - name: remark
            label: '@i18n:cell.NopSysExtField.remark,prop.label.NopSysExtField.remark|备注'
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysExtField__findPage'
    gql:selection: total,page,items{ id,entityName,entityId,fieldName,fieldType,decimalScale,decimalValue,dateValue,timestampValue,stringValue,createdBy,createTime,updatedBy,updateTime,remark
      }
  columns:
  - name: entityName
    label: '@i18n:col.NopSysExtField.entityName,prop.label.NopSysExtField.entityName|实体名'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: entityId
    label: '@i18n:col.NopSysExtField.entityId,prop.label.NopSysExtField.entityId|实体ID'
    sortable: true
    toggled: true
    type: static
  - name: fieldName
    label: '@i18n:col.NopSysExtField.fieldName,prop.label.NopSysExtField.fieldName|字段名'
    sortable: true
    toggled: true
    type: static
  - name: fieldType
    label: '@i18n:col.NopSysExtField.fieldType,prop.label.NopSysExtField.fieldType|字段类型'
    sortable: true
    toggled: true
    type: static
  - name: decimalScale
    label: '@i18n:col.NopSysExtField.decimalScale,prop.label.NopSysExtField.decimalScale|浮点精度'
    sortable: true
    toggled: true
    type: static
  - name: decimalValue
    label: '@i18n:col.NopSysExtField.decimalValue,prop.label.NopSysExtField.decimalValue|浮点值'
    sortable: true
    toggled: true
    type: static
  - name: dateValue
    label: '@i18n:col.NopSysExtField.dateValue,prop.label.NopSysExtField.dateValue|日期值'
    sortable: true
    toggled: true
    type: static
  - name: timestampValue
    label: '@i18n:col.NopSysExtField.timestampValue,prop.label.NopSysExtField.timestampValue|时间点值'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: stringValue
    label: '@i18n:col.NopSysExtField.stringValue,prop.label.NopSysExtField.stringValue|字符串值'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysExtField.createdBy,prop.label.NopSysExtField.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysExtField.createTime,prop.label.NopSysExtField.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysExtField.updatedBy,prop.label.NopSysExtField.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysExtField.updateTime,prop.label.NopSysExtField.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysExtField.remark,prop.label.NopSysExtField.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysExtField.forms.view.$title|查看-扩展字段'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysExtField__get?id=$id'
            gql:selection: id,entityName,entityId,fieldName,fieldType,decimalScale,decimalValue,dateValue,timestampValue,stringValue,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-entityName-entityId
            body:
            - name: entityName
              label: '@i18n:cell.NopSysExtField.entityName,prop.label.NopSysExtField.entityName|实体名'
              required: true
              type: static
            - name: entityId
              label: '@i18n:cell.NopSysExtField.entityId,prop.label.NopSysExtField.entityId|实体ID'
              required: true
              type: static
          - type: group
            id: row-fieldName-fieldType
            body:
            - name: fieldName
              label: '@i18n:cell.NopSysExtField.fieldName,prop.label.NopSysExtField.fieldName|字段名'
              required: true
              type: static
            - name: fieldType
              label: '@i18n:cell.NopSysExtField.fieldType,prop.label.NopSysExtField.fieldType|字段类型'
              required: true
              type: static
          - type: group
            id: row-decimalScale-decimalValue
            body:
            - name: decimalScale
              label: '@i18n:cell.NopSysExtField.decimalScale,prop.label.NopSysExtField.decimalScale|浮点精度'
              type: static
            - name: decimalValue
              label: '@i18n:cell.NopSysExtField.decimalValue,prop.label.NopSysExtField.decimalValue|浮点值'
              type: static
          - type: group
            id: row-dateValue-timestampValue
            body:
            - name: dateValue
              label: '@i18n:cell.NopSysExtField.dateValue,prop.label.NopSysExtField.dateValue|日期值'
              type: static
            - name: timestampValue
              label: '@i18n:cell.NopSysExtField.timestampValue,prop.label.NopSysExtField.timestampValue|时间点值'
              type: static
          - type: group
            id: row-stringValue-createdBy
            body:
            - name: stringValue
              label: '@i18n:cell.NopSysExtField.stringValue,prop.label.NopSysExtField.stringValue|字符串值'
              type: static
            - name: createdBy
              label: '@i18n:cell.NopSysExtField.createdBy,prop.label.NopSysExtField.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime-updatedBy
            body:
            - name: createTime
              label: '@i18n:cell.NopSysExtField.createTime,prop.label.NopSysExtField.createTime|创建时间'
              required: true
              type: static
            - name: updatedBy
              label: '@i18n:cell.NopSysExtField.updatedBy,prop.label.NopSysExtField.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime-remark
            body:
            - name: updateTime
              label: '@i18n:cell.NopSysExtField.updateTime,prop.label.NopSysExtField.updateTime|修改时间'
              required: true
              type: static
            - name: remark
              label: '@i18n:cell.NopSysExtField.remark,prop.label.NopSysExtField.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: md
          title: '@i18n:NopSysExtField.forms.edit.$title|编辑-扩展字段'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopSysExtField__get?id=$id'
              gql:selection: id,entityName,entityId,fieldName,fieldType,decimalScale,decimalValue,dateValue,timestampValue,stringValue,remark
            api:
              data:
                entityName: $entityName
                entityId: $entityId
                fieldName: $fieldName
                fieldType: $fieldType
                decimalScale: $decimalScale
                decimalValue: $decimalValue
                dateValue: $dateValue
                timestampValue: $timestampValue
                stringValue: $stringValue
                remark: $remark
              url: '@mutation:NopSysExtField__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-entityName-entityId
              body:
              - name: entityName
                label: '@i18n:cell.NopSysExtField.entityName,prop.label.NopSysExtField.entityName|实体名'
                required: true
                type: static
              - name: entityId
                label: '@i18n:cell.NopSysExtField.entityId,prop.label.NopSysExtField.entityId|实体ID'
                required: true
                type: static
            - type: group
              id: row-fieldName-fieldType
              body:
              - name: fieldName
                label: '@i18n:cell.NopSysExtField.fieldName,prop.label.NopSysExtField.fieldName|字段名'
                required: true
                type: static
              - name: fieldType
                label: '@i18n:cell.NopSysExtField.fieldType,prop.label.NopSysExtField.fieldType|字段类型'
                required: true
                type: input-text
                validations: isInt
            - type: group
              id: row-decimalScale-decimalValue
              body:
              - name: decimalScale
                label: '@i18n:cell.NopSysExtField.decimalScale,prop.label.NopSysExtField.decimalScale|浮点精度'
                type: input-text
                validations: isInt
              - name: decimalValue
                label: '@i18n:cell.NopSysExtField.decimalValue,prop.label.NopSysExtField.decimalValue|浮点值'
                type: input-number
                precision: 8
            - type: group
              id: row-dateValue-timestampValue
              body:
              - name: dateValue
                label: '@i18n:cell.NopSysExtField.dateValue,prop.label.NopSysExtField.dateValue|日期值'
                type: input-date
                format: YYYY-MM-DD
              - name: timestampValue
                label: '@i18n:cell.NopSysExtField.timestampValue,prop.label.NopSysExtField.timestampValue|时间点值'
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-stringValue-remark
              body:
              - name: stringValue
                label: '@i18n:cell.NopSysExtField.stringValue,prop.label.NopSysExtField.stringValue|字符串值'
                type: input-text
                clearable: true
                validations:
                  maxLength: 4000
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
              - name: remark
                label: '@i18n:cell.NopSysExtField.remark,prop.label.NopSysExtField.remark|备注'
                type: input-text
                clearable: true
                validations:
                  maxLength: 200
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopSysExtField__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
