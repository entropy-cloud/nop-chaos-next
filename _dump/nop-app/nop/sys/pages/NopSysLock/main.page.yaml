type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysLock__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: md
      title: '@i18n:NopSysLock.forms.add.$title|新增-资源锁'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysLock__save/id'
        body:
        - type: group
          id: row-lockName
          body:
            name: lockName
            label: '@i18n:cell.NopSysLock.lockName,prop.label.NopSysLock.lockName|锁名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-lockGroup
          body:
            name: lockGroup
            label: '@i18n:cell.NopSysLock.lockGroup,prop.label.NopSysLock.lockGroup|分组'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-lockTime
          body:
            name: lockTime
            label: '@i18n:cell.NopSysLock.lockTime,prop.label.NopSysLock.lockTime|锁定时间'
            required: true
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-expireAt
          body:
            name: expireAt
            label: '@i18n:cell.NopSysLock.expireAt,prop.label.NopSysLock.expireAt|过期时间'
            required: true
            type: input-datetime
            format: YYYY-MM-DD HH:mm:ss
        - type: group
          id: row-lockReason
          body:
            name: lockReason
            label: '@i18n:cell.NopSysLock.lockReason,prop.label.NopSysLock.lockReason|锁定原因'
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-holderId
          body:
            name: holderId
            label: '@i18n:cell.NopSysLock.holderId,prop.label.NopSysLock.holderId|锁的持有者'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-holderAdder
          body:
            name: holderAdder
            label: '@i18n:cell.NopSysLock.holderAdder,prop.label.NopSysLock.holderAdder|持有者地址'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-appId
          body:
            name: appId
            label: '@i18n:cell.NopSysLock.appId,prop.label.NopSysLock.appId|应用ID'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysLock__findPage'
    gql:selection: total,page,items{ id,lockName,lockGroup,lockTime,expireAt,lockReason,holderId,holderAdder,appId,createdBy,createTime,updatedBy,updateTime
      }
  columns:
  - name: lockName
    label: '@i18n:col.NopSysLock.lockName,prop.label.NopSysLock.lockName|锁名称'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: lockGroup
    label: '@i18n:col.NopSysLock.lockGroup,prop.label.NopSysLock.lockGroup|分组'
    sortable: true
    toggled: true
    type: static
  - name: lockTime
    label: '@i18n:col.NopSysLock.lockTime,prop.label.NopSysLock.lockTime|锁定时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: expireAt
    label: '@i18n:col.NopSysLock.expireAt,prop.label.NopSysLock.expireAt|过期时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: lockReason
    label: '@i18n:col.NopSysLock.lockReason,prop.label.NopSysLock.lockReason|锁定原因'
    sortable: true
    toggled: true
    type: static
  - name: holderId
    label: '@i18n:col.NopSysLock.holderId,prop.label.NopSysLock.holderId|锁的持有者'
    sortable: true
    toggled: true
    type: static
  - name: holderAdder
    label: '@i18n:col.NopSysLock.holderAdder,prop.label.NopSysLock.holderAdder|持有者地址'
    sortable: true
    toggled: true
    type: static
  - name: appId
    label: '@i18n:col.NopSysLock.appId,prop.label.NopSysLock.appId|应用ID'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysLock.createdBy,prop.label.NopSysLock.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysLock.createTime,prop.label.NopSysLock.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysLock.updatedBy,prop.label.NopSysLock.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysLock.updateTime,prop.label.NopSysLock.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysLock.forms.view.$title|查看-资源锁'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysLock__get?id=$id'
            gql:selection: id,lockName,lockGroup,lockTime,expireAt,lockReason,holderId,holderAdder,appId,createdBy,createTime,updatedBy,updateTime
          body:
          - type: group
            id: row-lockName-lockGroup
            body:
            - name: lockName
              label: '@i18n:cell.NopSysLock.lockName,prop.label.NopSysLock.lockName|锁名称'
              required: true
              type: static
            - name: lockGroup
              label: '@i18n:cell.NopSysLock.lockGroup,prop.label.NopSysLock.lockGroup|分组'
              required: true
              type: static
          - type: group
            id: row-lockTime-expireAt
            body:
            - name: lockTime
              label: '@i18n:cell.NopSysLock.lockTime,prop.label.NopSysLock.lockTime|锁定时间'
              required: true
              type: static
            - name: expireAt
              label: '@i18n:cell.NopSysLock.expireAt,prop.label.NopSysLock.expireAt|过期时间'
              required: true
              type: static
          - type: group
            id: row-lockReason-holderId
            body:
            - name: lockReason
              label: '@i18n:cell.NopSysLock.lockReason,prop.label.NopSysLock.lockReason|锁定原因'
              type: static
            - name: holderId
              label: '@i18n:cell.NopSysLock.holderId,prop.label.NopSysLock.holderId|锁的持有者'
              required: true
              type: static
          - type: group
            id: row-holderAdder-appId
            body:
            - name: holderAdder
              label: '@i18n:cell.NopSysLock.holderAdder,prop.label.NopSysLock.holderAdder|持有者地址'
              required: true
              type: static
            - name: appId
              label: '@i18n:cell.NopSysLock.appId,prop.label.NopSysLock.appId|应用ID'
              required: true
              type: static
          - type: group
            id: row-createdBy-createTime
            body:
            - name: createdBy
              label: '@i18n:cell.NopSysLock.createdBy,prop.label.NopSysLock.createdBy|创建人'
              required: true
              type: static
            - name: createTime
              label: '@i18n:cell.NopSysLock.createTime,prop.label.NopSysLock.createTime|创建时间'
              required: true
              type: static
          - type: group
            id: row-updatedBy-updateTime
            body:
            - name: updatedBy
              label: '@i18n:cell.NopSysLock.updatedBy,prop.label.NopSysLock.updatedBy|修改人'
              required: true
              type: static
            - name: updateTime
              label: '@i18n:cell.NopSysLock.updateTime,prop.label.NopSysLock.updateTime|修改时间'
              required: true
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: md
          title: '@i18n:NopSysLock.forms.edit.$title|编辑-资源锁'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopSysLock__get?id=$id'
              gql:selection: id,lockName,lockGroup,lockTime,expireAt,lockReason,holderId,holderAdder,appId
            api:
              data:
                lockName: $lockName
                lockGroup: $lockGroup
                lockTime: $lockTime
                expireAt: $expireAt
                lockReason: $lockReason
                holderId: $holderId
                holderAdder: $holderAdder
                appId: $appId
              url: '@mutation:NopSysLock__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-lockName
              body:
                name: lockName
                label: '@i18n:cell.NopSysLock.lockName,prop.label.NopSysLock.lockName|锁名称'
                required: true
                type: static
            - type: group
              id: row-lockGroup
              body:
                name: lockGroup
                label: '@i18n:cell.NopSysLock.lockGroup,prop.label.NopSysLock.lockGroup|分组'
                required: true
                type: static
            - type: group
              id: row-lockTime
              body:
                name: lockTime
                label: '@i18n:cell.NopSysLock.lockTime,prop.label.NopSysLock.lockTime|锁定时间'
                required: true
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-expireAt
              body:
                name: expireAt
                label: '@i18n:cell.NopSysLock.expireAt,prop.label.NopSysLock.expireAt|过期时间'
                required: true
                type: input-datetime
                format: YYYY-MM-DD HH:mm:ss
            - type: group
              id: row-lockReason
              body:
                name: lockReason
                label: '@i18n:cell.NopSysLock.lockReason,prop.label.NopSysLock.lockReason|锁定原因'
                type: input-text
                clearable: true
                validations:
                  maxLength: 200
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-holderId
              body:
                name: holderId
                label: '@i18n:cell.NopSysLock.holderId,prop.label.NopSysLock.holderId|锁的持有者'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-holderAdder
              body:
                name: holderAdder
                label: '@i18n:cell.NopSysLock.holderAdder,prop.label.NopSysLock.holderAdder|持有者地址'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-appId
              body:
                name: appId
                label: '@i18n:cell.NopSysLock.appId,prop.label.NopSysLock.appId|应用ID'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopSysLock__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
