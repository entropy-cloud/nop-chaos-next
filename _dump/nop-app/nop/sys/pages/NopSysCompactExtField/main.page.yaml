    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysCompactExtField__findPage'
    gql:selection: total,page,items{ id,sid,entityName,propName,position,displayName,dictName,defaultValue,createdBy,createTime,updatedBy,updateTime,remark
      }
  columns:
  - name: entityName
    label: '@i18n:col.NopSysCompactExtField.entityName,prop.label.NopSysCompactExtField.entityName|实体名'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: propName
    label: '@i18n:col.NopSysCompactExtField.propName,prop.label.NopSysCompactExtField.propName|属性名'
    sortable: true
    toggled: true
