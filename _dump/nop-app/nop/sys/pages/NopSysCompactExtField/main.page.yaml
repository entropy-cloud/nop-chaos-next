      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysCompactExtField__save/id'
        body:
        - type: group
          id: row-entityName
          body:
            name: entityName
            label: '@i18n:cell.NopSysCompactExtField.entityName,prop.label.NopSysCompactExtField.entityName|实体名'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-propName
          body:
            name: propName
            label: '@i18n:cell.NopSysCompactExtField.propName,prop.label.NopSysCompactExtField.propName|属性名'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-position
          body:
            name: position
            label: '@i18n:cell.NopSysCompactExtField.position,prop.label.NopSysCompactExtField.position|位置'
            required: true
            type: input-text
            validations: isInt
        - type: group
          id: row-displayName
          body:
            name: displayName
            label: '@i18n:cell.NopSysCompactExtField.displayName,prop.label.NopSysCompactExtField.displayName|显示名'
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-dictName
          body:
            name: dictName
            label: '@i18n:cell.NopSysCompactExtField.dictName,prop.label.NopSysCompactExtField.dictName|字典名'
            type: input-text
            clearable: true
            validations:
              maxLength: 150
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-defaultValue
          body:
            name: defaultValue
            label: '@i18n:cell.NopSysCompactExtField.defaultValue,prop.label.NopSysCompactExtField.defaultValue|默认值'
            type: input-text
            clearable: true
            validations:
              maxLength: 10
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopSysCompactExtField.remark,prop.label.NopSysCompactExtField.remark|备注'
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
