type: picker
valueField: id
labelField: name
size: lg
modalSize: lg
source:
  valueField: id
  labelField: name
  url: '@query:NopSysNoticeTemplate__findPage'
  gql:selection: total,page,items{ id,sid,name,tplType,content,createdBy,createTime,updatedBy,updateTime,remark
    }
pickerSchema:
  name: crud-grid
  syncLocation: false
  footable: false
  bulkActions: [
    ]
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysNoticeTemplate__findPage'
    gql:selection: total,page,items{ id,sid,name,tplType,content,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${name}
  columns:
  - name: sid
    label: '@i18n:col.NopSysNoticeTemplate.sid,prop.label.NopSysNoticeTemplate.sid|主键'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: name
    label: '@i18n:col.NopSysNoticeTemplate.name,prop.label.NopSysNoticeTemplate.name|名称'
    sortable: true
    toggled: true
    type: static
  - name: tplType
    label: '@i18n:col.NopSysNoticeTemplate.tplType,prop.label.NopSysNoticeTemplate.tplType|模板类型'
    sortable: true
    toggled: true
    type: static
  - name: content
    label: '@i18n:col.NopSysNoticeTemplate.content,prop.label.NopSysNoticeTemplate.content|模板内容'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysNoticeTemplate.createdBy,prop.label.NopSysNoticeTemplate.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysNoticeTemplate.createTime,prop.label.NopSysNoticeTemplate.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysNoticeTemplate.updatedBy,prop.label.NopSysNoticeTemplate.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysNoticeTemplate.updateTime,prop.label.NopSysNoticeTemplate.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysNoticeTemplate.remark,prop.label.NopSysNoticeTemplate.remark|备注'
    sortable: true
    toggled: true
    type: static
