type: page
name: main
body:
  type: crud
  name: crud-grid
  autoFillHeight: true
  syncLocation: false
  footable: false
  bulkActions:
  - type: action
    id: batch-delete-button
    actionType: ajax
    api:
      url: '@mutation:NopSysNoticeTemplate__batchDelete?ids=$ids'
    batch: true
    confirmText: '@i18n:common.confirmBatchDelete'
    label: '@i18n:common.batchDelete'
  itemActions: [
    ]
  headerToolbar:
  - type: filter-toggler
    id: filter-toggler
  - type: action
    id: add-button
    actionType: dialog
    dialog:
      type: page
      name: add
      size: md
      title: '@i18n:NopSysNoticeTemplate.forms.add.$title|新增-通知模板'
      body:
        type: form
        name: add
        mode: horizontal
        rules: [
          ]
        api:
          url: '@mutation:NopSysNoticeTemplate__save/id'
        body:
        - type: group
          id: row-sid
          body:
            name: sid
            label: '@i18n:cell.NopSysNoticeTemplate.sid,prop.label.NopSysNoticeTemplate.sid|主键'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 32
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-name
          body:
            name: name
            label: '@i18n:cell.NopSysNoticeTemplate.name,prop.label.NopSysNoticeTemplate.name|名称'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 100
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-tplType
          body:
            name: tplType
            label: '@i18n:cell.NopSysNoticeTemplate.tplType,prop.label.NopSysNoticeTemplate.tplType|模板类型'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 10
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-content
          body:
            name: content
            label: '@i18n:cell.NopSysNoticeTemplate.content,prop.label.NopSysNoticeTemplate.content|模板内容'
            required: true
            type: input-text
            clearable: true
            validations:
              maxLength: 4000
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
        - type: group
          id: row-remark
          body:
            name: remark
            label: '@i18n:cell.NopSysNoticeTemplate.remark,prop.label.NopSysNoticeTemplate.remark|备注'
            type: input-text
            clearable: true
            validations:
              maxLength: 200
              minLength: null
              matchRegexp: null
            transform:
              upperCase: null
              lowerCase: null
    icon: fa fa-plus pull-left
    label: '@i18n:common.add'
    level: primary
  - type: bulkActions
    id: bulkActions
  - type: columns-toggler
    align: right
    id: columns-toggler
  - type: reload
    align: right
    id: reload
  footerToolbar:
  - type: statistics
    id: statistics
  - type: switch-per-page
    id: switch-per-page
  - type: pagination
    id: pagination
  api:
    url: '@query:NopSysNoticeTemplate__findPage'
    gql:selection: total,page,items{ id,sid,name,tplType,content,createdBy,createTime,updatedBy,updateTime,remark
      }
  labelTpl: ${name}
  columns:
  - name: sid
    label: '@i18n:col.NopSysNoticeTemplate.sid,prop.label.NopSysNoticeTemplate.sid|主键'
    sortable: true
    toggled: true
    fixed: left
    type: static
  - name: name
    label: '@i18n:col.NopSysNoticeTemplate.name,prop.label.NopSysNoticeTemplate.name|名称'
    sortable: true
    toggled: true
    type: static
  - name: tplType
    label: '@i18n:col.NopSysNoticeTemplate.tplType,prop.label.NopSysNoticeTemplate.tplType|模板类型'
    sortable: true
    toggled: true
    type: static
  - name: content
    label: '@i18n:col.NopSysNoticeTemplate.content,prop.label.NopSysNoticeTemplate.content|模板内容'
    sortable: true
    toggled: true
    type: static
  - name: createdBy
    label: '@i18n:col.NopSysNoticeTemplate.createdBy,prop.label.NopSysNoticeTemplate.createdBy|创建人'
    sortable: true
    toggled: true
    type: static
  - name: createTime
    label: '@i18n:col.NopSysNoticeTemplate.createTime,prop.label.NopSysNoticeTemplate.createTime|创建时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: updatedBy
    label: '@i18n:col.NopSysNoticeTemplate.updatedBy,prop.label.NopSysNoticeTemplate.updatedBy|修改人'
    sortable: true
    toggled: true
    type: static
  - name: updateTime
    label: '@i18n:col.NopSysNoticeTemplate.updateTime,prop.label.NopSysNoticeTemplate.updateTime|修改时间'
    sortable: true
    width: 160px
    toggled: true
    type: static
  - name: remark
    label: '@i18n:col.NopSysNoticeTemplate.remark,prop.label.NopSysNoticeTemplate.remark|备注'
    sortable: true
    toggled: true
    type: static
  - type: operation
    label: '@i18n:common.operation'
    id: operation
    width: 140
    toggled: true
    fixed: right
    labelClassName: text-center
    buttons:
    - type: action
      id: row-view-button
      actionType: dialog
      dialog:
        type: page
        name: view
        size: md
        title: '@i18n:NopSysNoticeTemplate.forms.view.$title|查看-通知模板'
        body:
          type: form
          name: view
          mode: horizontal
          rules: [
            ]
          initApi:
            url: '@query:NopSysNoticeTemplate__get?id=$id'
            gql:selection: id,sid,name,tplType,content,createdBy,createTime,updatedBy,updateTime,remark
          body:
          - type: group
            id: row-sid
            body:
              name: sid
              label: '@i18n:cell.NopSysNoticeTemplate.sid,prop.label.NopSysNoticeTemplate.sid|主键'
              required: true
              type: static
          - type: group
            id: row-name
            body:
              name: name
              label: '@i18n:cell.NopSysNoticeTemplate.name,prop.label.NopSysNoticeTemplate.name|名称'
              required: true
              type: static
          - type: group
            id: row-tplType
            body:
              name: tplType
              label: '@i18n:cell.NopSysNoticeTemplate.tplType,prop.label.NopSysNoticeTemplate.tplType|模板类型'
              required: true
              type: static
          - type: group
            id: row-content
            body:
              name: content
              label: '@i18n:cell.NopSysNoticeTemplate.content,prop.label.NopSysNoticeTemplate.content|模板内容'
              required: true
              type: static
          - type: group
            id: row-createdBy
            body:
              name: createdBy
              label: '@i18n:cell.NopSysNoticeTemplate.createdBy,prop.label.NopSysNoticeTemplate.createdBy|创建人'
              required: true
              type: static
          - type: group
            id: row-createTime
            body:
              name: createTime
              label: '@i18n:cell.NopSysNoticeTemplate.createTime,prop.label.NopSysNoticeTemplate.createTime|创建时间'
              required: true
              type: static
          - type: group
            id: row-updatedBy
            body:
              name: updatedBy
              label: '@i18n:cell.NopSysNoticeTemplate.updatedBy,prop.label.NopSysNoticeTemplate.updatedBy|修改人'
              required: true
              type: static
          - type: group
            id: row-updateTime
            body:
              name: updateTime
              label: '@i18n:cell.NopSysNoticeTemplate.updateTime,prop.label.NopSysNoticeTemplate.updateTime|修改时间'
              required: true
              type: static
          - type: group
            id: row-remark
            body:
              name: remark
              label: '@i18n:cell.NopSysNoticeTemplate.remark,prop.label.NopSysNoticeTemplate.remark|备注'
              type: static
      label: '@i18n:common.view'
      level: primary
    - type: dropdown-button
      id: row-more-button
      label: '@i18n:common.more'
      level: primary
      buttons:
      - actionType: dialog
        dialog:
          type: page
          name: update
          size: md
          title: '@i18n:NopSysNoticeTemplate.forms.edit.$title|编辑-通知模板'
          body:
            type: form
            name: edit
            mode: horizontal
            rules: [
              ]
            initApi:
              url: '@query:NopSysNoticeTemplate__get?id=$id'
              gql:selection: id,sid,name,tplType,content,remark
            api:
              data:
                sid: $sid
                name: $name
                tplType: $tplType
                content: $content
                remark: $remark
              url: '@mutation:NopSysNoticeTemplate__update/id?id=$id'
              withFormData: true
            body:
            - type: group
              id: row-sid
              body:
                name: sid
                label: '@i18n:cell.NopSysNoticeTemplate.sid,prop.label.NopSysNoticeTemplate.sid|主键'
                required: true
                type: static
            - type: group
              id: row-name
              body:
                name: name
                label: '@i18n:cell.NopSysNoticeTemplate.name,prop.label.NopSysNoticeTemplate.name|名称'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 100
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-tplType
              body:
                name: tplType
                label: '@i18n:cell.NopSysNoticeTemplate.tplType,prop.label.NopSysNoticeTemplate.tplType|模板类型'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 10
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-content
              body:
                name: content
                label: '@i18n:cell.NopSysNoticeTemplate.content,prop.label.NopSysNoticeTemplate.content|模板内容'
                required: true
                type: input-text
                clearable: true
                validations:
                  maxLength: 4000
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
            - type: group
              id: row-remark
              body:
                name: remark
                label: '@i18n:cell.NopSysNoticeTemplate.remark,prop.label.NopSysNoticeTemplate.remark|备注'
                type: input-text
                clearable: true
                validations:
                  maxLength: 200
                  minLength: null
                  matchRegexp: null
                transform:
                  upperCase: null
                  lowerCase: null
        id: row-update-button
        label: '@i18n:common.edit'
        type: button
      - actionType: ajax
        api:
          url: '@mutation:NopSysNoticeTemplate__delete?id=$id'
        confirmText: '@i18n:common.confirmDelete'
        id: row-delete-button
        label: '@i18n:common.delete'
        type: button
