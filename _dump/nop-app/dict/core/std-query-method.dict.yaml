<?xml version="1.0" encoding="UTF-8" ?>
<dict label="查询方法" locale="zh-CN" xmlns:x="/nop/schema/xdsl.xdef" x:validated="true"
      x:schema="/nop/schema/orm/dict.xdef">

    <description>CRUD服务所支持的标准查询方法</description>

    <option value="findCount" label="返回符合条件的条目总数，返回类型为Long"/>

    <option value="findFirst" label="返回符合条件的第一条记录，返回类型为对象类型"/>

    <option value="findList" label="返回符合条件的所有记录，返回类型为对象列表"/>

    <option value="findPage" label="返回符合条件的分页查询记录，返回类型为PageBean"/>

    <option value="findConnection" label="返回符合条件的分页查询记录，返回类型为GraphQLConnection"/>
</dict>